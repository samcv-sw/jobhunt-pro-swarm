<!DOCTYPE html>
<html lang="{{ lang | default('ar') }}" dir="{{ dir | default('rtl') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>JobHunt Pro — غير متصل بالإنترنت | Offline Mode</title>
    <meta name="theme-color" content="#05050a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/cyberpunk.css">
    <link rel="stylesheet" href="/static/css/premium-ui.css">
    <style>
        :root {
            --bg-color: #05050a;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-block-size: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
        }

        .offline-container {
            max-inline-size: 520px;
            margin-inline: 1.5rem;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.1);
            position: relative;
        }

        .wifi-icon-wrapper {
            inline-size: 88px;
            block-size: 88px;
            margin: 0 auto 1.5rem auto;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-pink);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 127, 0.5); transform: scale(1.05); }
        }

        .wifi-icon-wrapper svg {
            inline-size: 44px;
            block-size: 44px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-block-end: 0.75rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.6;
            margin-block-end: 2rem;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            inline-size: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.5);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .lang-switch {
            margin-block-start: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .lang-switch a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="wifi-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p class="desc">
            يبدو أنك غير متصل بالشبكة حالياً. يرجى التحقق من اتصال الواي فاي أو بيانات الهاتف المحمول ثم إعادة المحاولة.
        </p>
        <button class="btn-retry" onclick="window.location.reload()">
            إعادة الاتصال الآن | Retry Connection
        </button>
        <div class="lang-switch">
            JobHunt Pro SaaS • <a href="/">الرئيسية</a>
        </div>
    </div>
</body>
</html>
