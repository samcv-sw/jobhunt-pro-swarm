<!-- Instant AI ATS CV Audit Floating Widget (Saudi Vision 2030 & UAE D33 Sub-2s Engine) -->
<style>
  .ats-growth-widget-container {
    position: fixed;
    inset-inline-end: 1.5rem;
    inset-block-end: 1.5rem;
    z-index: 9999;
    font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif;
    direction: inherit;
  }

  .ats-widget-badge {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    border: 1px solid rgba(16, 185, 129, 0.4);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(16, 185, 129, 0.2);
    border-radius: 9999px;
    padding-inline: 1.25rem;
    padding-block: 0.75rem;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ats-widget-badge:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.6), 0 0 25px rgba(16, 185, 129, 0.4);
    border-color: rgba(16, 185, 129, 0.8);
  }

  .ats-widget-pulse {
    inline-size: 10px;
    block-size: 10px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: atsPulse 2s infinite;
  }

  @keyframes atsPulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .ats-widget-modal {
    display: none;
    position: fixed;
    inset-inline-end: 1.5rem;
    inset-block-end: 5.5rem;
    inline-size: 420px;
    max-inline-size: calc(100vw - 3rem);
    background: rgba(15, 23, 42, 0.96);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 1.25rem;
    padding: 1.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    z-index: 9999;
    color: #f8fafc;
    box-sizing: border-box;
    max-block-size: 85vh;
    overflow-y: auto;
  }

  .ats-widget-modal.active {
    display: block;
    animation: atsSlideUp 0.3s ease-out;
  }

  @keyframes atsSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ats-widget-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-block-end: 1rem;
    border-block-end: 1px solid rgba(255, 255, 255, 0.1);
    padding-block-end: 0.75rem;
  }

  .ats-widget-title {
    font-weight: 800;
    font-size: 1.05rem;
    color: #34d399;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ats-widget-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.25rem;
    line-height: 1;
  }

  .ats-widget-close:hover { color: #f8fafc; }

  .ats-widget-input, .ats-widget-textarea, .ats-widget-select {
    inline-size: 100%;
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 0.5rem;
    padding-inline: 0.75rem;
    padding-block: 0.6rem;
    color: #f8fafc;
    font-size: 0.88rem;
    margin-block-end: 0.75rem;
    font-family:inherit;
    box-sizing: border-box;
  }

  .ats-widget-textarea {
    min-block-size: 90px;
    resize: vertical;
  }

  .ats-widget-btn {
    inline-size: 100%;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
    font-weight: 700;
    border: none;
    border-radius: 0.5rem;
    padding-block: 0.75rem;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    font-family:inherit;
  }

  .ats-widget-btn:hover {
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    transform: translateY(-1px);
  }

  /* Score Meters Grid */
  .ats-scores-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-block: 1rem;
    text-align: center;
  }

  .ats-score-box {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0.6rem;
    padding: 8px 4px;
  }

  .ats-score-num {
    font-size: 1.3rem;
    font-weight: 900;
    color: #34d399;
    font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', var(--font-mono);
  }

  .ats-score-lbl {
    font-size: 0.7rem;
    color: #94a3b8;
    margin-block-start: 2px;
  }

  .hp-field-stealth {
    display: none !important;
    visibility: hidden !important;
    position: absolute !important;
    inset-inline-start: -9999px !important;
  }
</style>

<div class="ats-growth-widget-container">
  <div class="ats-widget-badge" id="atsGrowthBadge" onclick="toggleAtsWidget()">
    <div class="ats-widget-pulse"></div>
    <span style="font-size: 0.92rem; font-weight: 700;">⚡ فحص الـ ATS الخليجي (رؤية 2030 & D33)</span>
  </div>

  <div class="ats-widget-modal" id="atsGrowthModal">
    <div class="ats-widget-header">
      <h4 class="ats-widget-title">
        <span>⚡ الفاحص الذكي للسيرة الذاتية (Instant CV Audit)</span>
      </h4>
      <button class="ats-widget-close" onclick="toggleAtsWidget()" aria-label="Close">&times;</button>
    </div>
    
    <form id="atsGrowthForm" onsubmit="handleAtsWidgetSubmit(event)">
      <!-- Zero-Trust Honeypot Decoy Fields -->
      <input type="text" name="website_url_hp" class="hp-field-stealth" tabindex="-1" autocomplete="off" dir="auto">
      <input type="text" name="phone_confirm_hp" class="hp-field-stealth" tabindex="-1" autocomplete="off" dir="auto">
      
      <label style="font-size: 0.8rem; color: #94a3b8; display: block; margin-block-end: 0.25rem;">
        السوق المستهدف:
      </label>
      <select name="market_focus" id="atsMarketFocus" class="ats-widget-select" dir="auto">
        <option value="all">🌐 السوق الخليجي الموحد (GCC Unified)</option>
        <option value="saudi">🇸🇦 رؤية السعودية 2030 (نيوم، التوطين، سدايا)</option>
        <option value="uae">🇦🇪 أجندة دبي D33 (المناطق الحرة، الاقتصاد الرقمي)</option>
      </select>

      <label style="font-size: 0.8rem; color: #94a3b8; display: block; margin-block-end: 0.25rem;">
        المسمى الوظيفي المستهدف:
      </label>
      <input type="text" name="job_title" id="atsJobTitle" class="ats-widget-input" dir="auto" placeholder="مثال: Senior Project Manager / المهندس المعماري">

      <label style="font-size: 0.8rem; color: #94a3b8; display: block; margin-block-end: 0.25rem;">
        الصق نص سيرتك الذاتية (أو فقرة الخبرات):
      </label>
      <textarea name="cv_text" id="atsCvText" class="ats-widget-textarea" dir="auto" placeholder="الصق نص السيرة الذاتية هنا للتحليل الفوري خلال أقل من ثانية..." required></textarea>
      
      <button type="submit" id="atsSubmitBtn" class="ats-widget-btn">⚡ فحص فوري خلال &lt;2 ثانية</button>
    </form>
    
    <div id="atsGrowthResult" style="display: none; margin-block-start: 1rem;">
      <div class="ats-scores-grid">
        <div class="ats-score-box">
          <div class="ats-score-num" id="resOverallScore">0%</div>
          <div class="ats-score-lbl">التطابق العام</div>
        </div>
        <div class="ats-score-box">
          <div class="ats-score-num" style="color: #60a5fa;" id="resSaudiScore">0%</div>
          <div class="ats-score-lbl">رؤية 2030 🇸🇦</div>
        </div>
        <div class="ats-score-box">
          <div class="ats-score-num" style="color: #c084fc;" id="resUaeScore">0%</div>
          <div class="ats-score-lbl">أجندة D33 🇦🇪</div>
        </div>
      </div>

      <div id="resReadinessBadge" style="padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; margin-block-end: 8px; text-align: center;"></div>

      <div style="font-size: 0.78rem; color: #cbd5e1; margin-block-end: 8px;" id="resRecText"></div>

      <div id="resKeywordsBox" style="display: flex; flex-wrap: wrap; gap: 4px; margin-block-end: 10px;"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: #64748b; border-block-start: 1px solid rgba(255,255,255,0.06); padding-block-start: 6px;">
        <span id="resLatency">⚡ وقت الاستجابة: 0ms</span>
        <a href="/pricing" style="color: #34d399; font-weight: 700; text-decoration: none;">🚀 حسّن سيرتك تلقائياً →</a>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleAtsWidget() {
    const modal = document.getElementById('atsGrowthModal');
    if (modal) {
      modal.classList.toggle('active');
    }
  }

  async function handleAtsWidgetSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById('atsSubmitBtn');
    const resultDiv = document.getElementById('atsGrowthResult');
    const form = document.getElementById('atsGrowthForm');

    const cvText = document.getElementById('atsCvText').value;
    const jobTitle = document.getElementById('atsJobTitle').value;
    const marketFocus = document.getElementById('atsMarketFocus').value;

    if (!cvText || cvText.trim().length < 15) {
      alert('يرجى لصق نص كافٍ من السيرة الذاتية لإتمام الفحص.');
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ جارٍ التحليل الفوري...';

    try {
      const resp = await fetch('/api/v1/cv-audit/instant-score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cv_text: cvText,
          job_title: jobTitle,
          market_focus: marketFocus
        })
      });

      const data = await resp.json();
      if (data.overall_score !== undefined) {
        document.getElementById('resOverallScore').textContent = data.overall_score + '%';
        document.getElementById('resSaudiScore').textContent = (data.saudi_vision_2030 ? data.saudi_vision_2030.score : 0) + '%';
        document.getElementById('resUaeScore').textContent = (data.uae_d33 ? data.uae_d33.score : 0) + '%';

        const badge = document.getElementById('resReadinessBadge');
        if (data.readiness_level) {
          badge.textContent = data.readiness_level.label_ar;
          badge.style.backgroundColor = (data.readiness_level.color || '#10b981') + '22';
          badge.style.color = data.readiness_level.color || '#10b981';
          badge.style.border = '1px solid ' + (data.readiness_level.color || '#10b981') + '44';
        }

        const recEl = document.getElementById('resRecText');
        if (data.recommendations_ar && data.recommendations_ar.length > 0) {
          recEl.textContent = '💡 ' + data.recommendations_ar[0];
        }

        const kwBox = document.getElementById('resKeywordsBox');
        kwBox.innerHTML = '';
        if (data.suggested_keywords) {
          data.suggested_keywords.slice(0, 5).forEach(kw => {
            const span = document.createElement('span');
            span.style.fontSize = '0.72rem';
            span.style.padding = '2px 6px';
            span.style.borderRadius = '4px';
            span.style.background = 'rgba(59, 130, 246, 0.2)';
            span.style.color = '#93c5fd';
            span.textContent = '+' + kw;
            kwBox.appendChild(span);
          });
        }

        document.getElementById('resLatency').textContent = '⚡ زمن الفحص: ' + data.execution_time_ms + 'ms' + (data.cached ? ' (L1 Cache)' : '');
        resultDiv.style.display = 'block';
      }
    } catch (err) {
      console.error('ATS audit error:', err);
      alert('حدث خطأ أثناء إجراء الفحص الفوري.');
    } finally {
      btn.disabled = false;
      btn.textContent = '⚡ فحص فوري خلال <2 ثانية';
    }
  }
</script>
