<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive AI Lead Scoring | JobHunt Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.8);
            --border-color: rgba(56, 139, 253, 0.2);
            --accent-blue: #58a6ff;
            --accent-hot: #ef4444;
            --accent-warm: #f59e0b;
            --accent-cold: #3b82f6;
            --text-main: #c9d1d9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
        }

        .container {
            max-inline-size: 1100px;
            margin-inline: auto;
            padding: 2rem 1rem;
        }

        .header {
            margin-block-end: 2rem;
        }

        .title {
            font-size: 2.2rem;
            color: #fff;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-block-end: 1.5rem;
        }

        .score-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .badge-hot { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-warm { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-block-end: 1rem;
        }

        .input-field {
            inline-size: 100%;
            padding: 0.6rem;
            border-radius: 0.375rem;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            box-sizing: border-box;
        }

        .btn-score {
            background: #238636;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🔮 Predictive AI Lead Scoring Engine</h1>
            <p>حساب احتمالية التفاعل والتحويل (Conversion Propensity) قبل البدء بالتواصل</p>
        </div>

        <div class="card">
            <h3>فحص وتسكير فرصة جديدة (Calculate Lead Score)</h3>
            <form onsubmit="event.preventDefault(); scoreLead();">
                <div class="form-grid">
                    <div>
                        <label>نطاق الشركة (Domain):</label>
                        <input type="text" id="domain" class="input-field" value="aramco.com" dir="ltr" required>
                    </div>
                    <div>
                        <label>المسمى الوظيفي (Job Title):</label>
                        <input type="text" id="title" class="input-field" value="VP of Digital Transformation" dir="auto" required>
                    </div>
                    <div>
                        <label>حجم الشركة:</label>
                        <input type="number" id="size" class="input-field" value="500" dir="auto">
                    </div>
                </div>
                <button type="submit" class="btn-score">احسب النتيجة والمسار الموصى به 🎯</button>
            </form>
        </div>

        <div class="card" id="resultCard" style="display:none;">
            <h3>النتيجة والتحليل الذكي</h3>
            <p>نسبة التجاوب المتوقعة: <strong id="scoreVal" style="font-size:1.5rem; color:#10b981;">--</strong></p>
            <p>التصنيف: <span id="categoryBadge" class="score-badge badge-hot">--</span></p>
            <p>القناة الموصى بها: <strong id="channelVal" style="color:var(--accent-blue);">--</strong></p>
        </div>
    </div>

    <script>
        async function scoreLead() {
            const domain = document.getElementById('domain').value;
            const title = document.getElementById('title').value;
            const size = parseInt(document.getElementById('size').value);

            const res = await fetch('/api/predictive-scoring/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company_domain: domain, job_title: title, company_size: size })
            });

            const data = await res.json();
            document.getElementById('scoreVal').innerText = data.propensity_score + '%';
            document.getElementById('categoryBadge').innerText = data.category;
            document.getElementById('channelVal').innerText = data.recommended_channel;
            document.getElementById('resultCard').style.display = 'block';
        }
    </script>
</body>
</html>
