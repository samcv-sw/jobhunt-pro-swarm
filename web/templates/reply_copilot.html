<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SDR Reply Copilot — JobHunt Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Cairo', 'Tajawal', sans-serif;
            margin: 0;
            padding-block: 2rem;
            padding-inline: 1.5rem;
        }

        .container {
            max-inline-size: 850px;
            margin-inline: auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }

        textarea {
            inline-size: 100%;
            min-block-size: 120px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            dir: auto;
            box-sizing: border-box;
            margin-block-end: 1rem;
        }

        button {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            cursor: pointer;
        }

        .res-panel {
            margin-block-start: 1.5rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مساعد الرد الذكي AI SDR Reply Copilot</h1>
        <p style="color: var(--text-muted);">تحليل رد العميل وتصنيف الانطباع واقتراح الرد المناسب تلقائياً</p>

        <div class="card">
            <textarea id="reply_input" placeholder="الصق رد العميل هنا... (مثال: 'إحنا مهتمين، ابعتلنا مواعيد للمقابلة')"></textarea>
            <button onclick="classifyReply()">تحليل الرد وتصنيفه</button>

            <div class="res-panel" id="res_panel" style="display: none;">
                <h3 id="res_cat" style="margin: 0; color: var(--accent-blue);">-</h3>
                <p id="res_act" style="color: var(--text-muted);">-</p>
                <div style="margin-block-start: 1rem; background: rgba(0,0,0,0.3); padding: 0.75rem; border-radius: 8px;">
                    <strong>الرد المقترح تلقائياً:</strong>
                    <p id="res_draft" style="margin-block-start: 0.5rem; margin-block-end: 0; color: #fff;">-</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function classifyReply() {
            let text = document.getElementById('reply_input').value;
            if (!text) return alert('يرجى إدخال نص الرد');

            try {
                let res = await fetch('/reply-copilot/classify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reply_text: text})
                });
                let data = await res.json();
                document.getElementById('res_panel').style.display = 'block';
                document.getElementById('res_cat').innerText = 'التصنيف: ' + data.category + ' (' + (data.confidence * 100) + '% مؤكد)';
                document.getElementById('res_act').innerText = 'الإجراء التلقائي: ' + data.action;
                document.getElementById('res_draft').innerText = data.suggested_reply || 'لا يوجد رد مقترح تلقائياً (إلغاء الاشتراك)';
            } catch(e) {
                alert('حدث خطأ');
            }
        }
    </script>
</body>
</html>
