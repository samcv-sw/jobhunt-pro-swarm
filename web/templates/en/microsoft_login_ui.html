<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in to your Microsoft account</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap"/>
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #1b1b1b;
      background-image: radial-gradient(circle at 50% 50%, #292929 0%, #121212 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .ms-container {
      width: 100%;
      max-width: 440px;
    }
    .ms-card {
      background: #242424;
      padding: 44px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin-bottom: 16px;
      position: relative;
    }
    .ms-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .ms-logo-icon {
      width: 24px;
      height: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .ms-logo-icon span:nth-child(1) { background: #f25022; }
    .ms-logo-icon span:nth-child(2) { background: #7fba00; }
    .ms-logo-icon span:nth-child(3) { background: #00a4ef; }
    .ms-logo-icon span:nth-child(4) { background: #ffb900; }
    .ms-brand-text {
      font-size: 19px;
      font-weight: 600;
      color: #cccccc;
    }
    .ms-title {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 20px;
    }
    .ms-quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .account-form {
      margin: 0;
      width: 100%;
    }
    .ms-quick-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      cursor: pointer;
      color: #ffffff;
      font-size: 14px;
      text-align: start;
      transition: background 0.15s;
    }
    .ms-quick-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .ms-quick-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #0078d4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .ms-input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .ms-input {
      width: 100%;
      padding: 10px 0;
      font-size: 16px;
      color: #ffffff;
      border: none;
      border-bottom: 1px solid #777777;
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
    }
    .ms-input:focus {
      border-bottom: 2px solid #0086f0;
    }
    .ms-input::placeholder {
      color: #888888;
    }
    .ms-links {
      margin-bottom: 24px;
      font-size: 13px;
    }
    .ms-link {
      color: #0086f0;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }
    .ms-link:hover {
      text-decoration: underline;
    }
    .ms-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-ms-next {
      padding: 8px 28px;
      background: #0067b8;
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-ms-next:hover {
      background: #0078d4;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #0086f0;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="ms-container">
    <div class="ms-card">
      <div class="ms-brand">
        <div class="ms-logo-icon">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-brand-text">Microsoft</span>
      </div>

      <h1 class="ms-title">Sign in</h1>

      <div class="ms-quick-list">
        <!-- 1. Sam Salameh (sam.dev1@hotmail.com) -->
        <form action="/auth/oauth-submit" method="POST" class="account-form">
          <input type="hidden" name="provider" value="microsoft">
          <input type="hidden" name="name" value="Sam Salameh">
          <input type="hidden" name="email" value="sam.dev1@hotmail.com">
          <button type="submit" class="ms-quick-btn">
            <div class="ms-quick-avatar">S</div>
            <div>
              <div style="font-weight:600;">Sam Salameh</div>
              <div style="font-size:12px; color:#aaa;">sam.dev1@hotmail.com</div>
            </div>
          </button>
        </form>

        <!-- 2. Sam Salameh (samsalameh@outlook.com) -->
        <form action="/auth/oauth-submit" method="POST" class="account-form">
          <input type="hidden" name="provider" value="microsoft">
          <input type="hidden" name="name" value="Sam Salameh">
          <input type="hidden" name="email" value="samsalameh@outlook.com">
          <button type="submit" class="ms-quick-btn">
            <div class="ms-quick-avatar">S</div>
            <div>
              <div style="font-weight:600;">Sam Salameh</div>
              <div style="font-size:12px; color:#aaa;">samsalameh@outlook.com</div>
            </div>
          </button>
        </form>
      </div>

      <!-- Custom Input Form -->
      <form action="/auth/oauth-submit" method="POST">
        <input type="hidden" name="provider" value="microsoft">
        <input type="hidden" name="name" value="Microsoft User">
        <div class="ms-input-group">
          <input type="email" name="email" class="ms-input" placeholder="Email, phone, or Skype" required>
        </div>

        <div class="ms-links">
          <span style="color:#aaa;">No account? </span>
          <a href="#" onclick="alert('Creating new accounts is automated upon login.'); return false;" class="ms-link">Create one!</a>
        </div>

        <div class="ms-actions">
          <button type="submit" class="btn-ms-next">Sign In</button>
        </div>
      </form>

      <a href="/login" class="back-link">← Back to Login</a>
    </div>
  </div>

</body>
</html>
