<style>
.nav-links a:not(.cta):hover { color: #fff !important; background: rgba(255,255,255,0.06) !important; }
#nav {
    position: absolute;
    inset-block-start: 16px;
    inset-inline-start: 0;
    inset-inline-end: 0;
    margin-inline: auto;
    transform: none;
    inline-size: calc(100% - 32px);
    max-inline-size: 1240px;
    z-index: 1000;
    background: rgba(8, 12, 24, 0.88) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 14px !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
    transition: all 0.3s ease;
}
#nav.scrolled {
    background: rgba(5, 8, 18, 0.96) !important;
    border-color: rgba(0, 240, 255, 0.25) !important;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.12) !important;
}
.nav-links a.nav-active {
  color: #00f0ff !important;
  background: rgba(0, 240, 255, 0.15) !important;
  border: 1px solid rgba(0, 240, 255, 0.35) !important;
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.25) !important;
  font-weight: 700 !important;
  border-radius: 8px !important;
}

@media (max-width: 1180px) {
    .nav-hamburger { display: flex !important; }
    .nav-links {
        position: fixed; inset-block-start: 0; inset-inline-end: -100%; inline-size: 300px; max-inline-size: 100vw; block-size: 100vh;
        background: rgba(3,3,12,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-inline-start: 1px solid rgba(255,255,255,0.1); flex-direction: column; justify-content: flex-start;
        padding: 40px; transition: inset-inline-end 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow-y: auto !important;
    }
    .nav-links.active { inset-inline-end: 0; }
    .nav-links a { inline-size: 100%; text-align: center; padding: 12px; font-size: 15px !important; white-space: nowrap !important; }
    .nav-hamburger.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-hamburger.active span:nth-child(2) { opacity: 0; }
    .nav-hamburger.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
}
</style>

<script>
(function() {
  function highlightActiveNav() {
    try {
      const path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '');
      const hash = (window.location.hash || '').toLowerCase();
      const links = document.querySelectorAll('.nav-links a');
      
      let matched = false;

      links.forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href === '#' || link.classList.contains('lang-switcher') || link.classList.contains('cta')) return;
        
        link.classList.remove('nav-active');
        
        const cleanHref = href.split('?')[0].split('#')[0].toLowerCase().replace(/\/+$/, '');
        const hrefHash = href.includes('#') ? '#' + href.split('#')[1].toLowerCase() : '';
        
        if (hash && hrefHash && hash === hrefHash) {
          link.classList.add('nav-active');
          matched = true;
        } else if (!matched && cleanHref && cleanHref !== '/' && cleanHref !== '' && path.includes(cleanHref)) {
          link.classList.add('nav-active');
          matched = true;
        }
      });

      if (!matched && (path === '' || path === '/')) {
        const homeLink = document.getElementById('nav-home');
        if (homeLink) homeLink.classList.add('nav-active');
      }
    } catch(e) {
      console.error('[NAV] Active highlight error:', e);
    }
  }

  document.addEventListener('click', function(e) {
    const target = e.target.closest('.nav-links a');
    if (target && !target.classList.contains('lang-switcher') && !target.classList.contains('cta')) {
      document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('nav-active'));
      target.classList.add('nav-active');
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', highlightActiveNav);
  } else {
    highlightActiveNav();
  }
  window.addEventListener('hashchange', highlightActiveNav);

  if (typeof toggleMenu !== 'function') {
    window.toggleMenu = function() {
      const hb = document.getElementById('hamburger');
      const nl = document.getElementById('navLinks');
      if (hb) hb.classList.toggle('active');
      if (nl) nl.classList.toggle('active');
    };
  }
})();
</script>
