<meta property="og:title" content="Track Job Postings & Applicants | JobHunt Pro"/>
<meta name="description" content="Real-time recruiter dashboard to track posted jobs, applicant CVs, and match metrics."/>
<title>Track Job Postings & Applicants | JobHunt Pro</title>
<link href="/static/css/cyberpunk.css" rel="stylesheet"/>
<link href="/static/css/apex_glassmorphism.css" rel="stylesheet"/>

<style>
:root {
  --text-x-direction: 1;
  --primary-glow: #00f0ff;
  --secondary-glow: #a855f7;
}

.track-page {
  inline-size: 100%;
  max-inline-size: 1200px;
  margin-inline: auto;
  padding: 30px 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* ── Hero Card ── */
.track-hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 27, 75, 0.8) 50%, rgba(15, 23, 42, 0.95) 100%);
  border: 1px solid rgba(0, 240, 255, 0.35);
  padding: 36px 30px;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 240, 255, 0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  margin-block-end: 30px;
  text-align: center;
}
.track-hero::before {
  content: '';
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: 0;
  inline-size: 100%;
  block-size: 3px;
  background: linear-gradient(90deg, #00f0ff, #818cf8, #c084fc, #34d399);
}
.track-hero-title {
  font-size: clamp(24px, 3.5vw, 36px);
  font-weight: 900;
  line-height: 1.25;
  background: linear-gradient(135deg, #ffffff 0%, #00f0ff 60%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.track-hero-subtitle {
  font-size: 15px;
  color: #cbd5e1;
  max-inline-size: 700px;
  margin-inline: auto;
  margin-block-end: 20px;
  line-height: 1.6;
}
.track-options-bar {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.track-option-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: rgba(0, 240, 255, 0.08);
  padding: 8px 18px;
  border-radius: 50px;
  border: 1px solid rgba(0, 240, 255, 0.25);
  font-size: 13.5px;
  font-weight: 700;
  color: #e2e8f0;
  transition: all 0.25s ease;
}
.track-option-pill:hover {
  background: rgba(0, 240, 255, 0.15);
  border-color: rgba(0, 240, 255, 0.5);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}

/* ── Search Form Card ── */
.track-search-card {
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  max-inline-size: 600px;
  margin-inline: auto;
  margin-block-end: 32px;
}
.track-search-title {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  margin: 0 0 18px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.track-form-group {
  margin-block-end: 16px;
}
.track-label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: #94a3b8;
  margin-block-end: 6px;
}
.track-input {
  inline-size: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(0, 0, 0, 0.45);
  color: #ffffff;
  font-size: 14.5px;
  font-family: inherit;
  box-sizing: border-box;
  transition: all 0.25s ease;
}
.track-input:focus {
  outline: none;
  border-color: #00f0ff;
  box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2);
}
.track-btn {
  inline-size: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00f0ff, #00b8ff);
  color: #050515;
  font-size: 15.5px;
  font-weight: 800;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(0, 240, 255, 0.35);
  transition: all 0.25s ease;
  font-family: inherit;
}
.track-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(0, 240, 255, 0.55);
}
.track-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* ── Job Cards ── */
.job-card {
  position: relative;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.88) 0%, rgba(10, 15, 29, 0.96) 100%);
  border: 1px solid rgba(0, 240, 255, 0.2);
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(16px);
  margin-block-end: 18px;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.job-card:hover {
  border-color: rgba(0, 240, 255, 0.45);
  box-shadow: 0 16px 45px rgba(0, 240, 255, 0.15);
  transform: translateY(-3px);
}
.job-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  margin-block-end: 14px;
}
.job-card-title {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  margin-block-end: 4px;
}
.job-card-company {
  font-size: 14px;
  color: #94a3b8;
  font-weight: 600;
}
.stat-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 12.5px;
  font-weight: 800;
}
.stat-badge.tier { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.35); color: #c084fc; }
.stat-badge.status { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.35); color: #34d399; }
.stat-badge.urgent { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; animation: pulse 2s infinite; }
.stat-badge.views { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.35); color: #60a5fa; }
.stat-badge.apps { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.35); color: #4ade80; }

.job-card-meta {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 13px;
  font-weight: 600;
  color: #cbd5e1;
  padding-block: 10px;
  border-block: 1px solid rgba(255, 255, 255, 0.06);
  margin-block-end: 14px;
}

.job-actions-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.btn-action-apply {
  padding: 8px 18px;
  border-radius: 10px;
  border: 1px solid rgba(52, 211, 153, 0.4);
  background: rgba(52, 211, 153, 0.15);
  color: #34d399;
  font-size: 13.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.btn-action-apply:hover {
  background: rgba(52, 211, 153, 0.25);
  box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
}
.btn-action-details {
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.05);
  color: #94a3b8;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.btn-action-details:hover {
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}

/* Detail Section */
.detail-section {
  margin-block-start: 16px;
  padding: 18px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  display: none;
}
.detail-section.open {
  display: block;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-size: 13px;
}
.detail-box {
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.04);
}
.detail-box .label {
  color: #64748b;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  margin-block-end: 4px;
}
.detail-box .value {
  color: #f1f5f9;
  font-weight: 600;
  word-break: break-all;
}
.detail-box.full {
  grid-column: 1 / -1;
}
.copy-btn {
  font-size: 11.5px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 6px;
  background: rgba(0, 240, 255, 0.15);
  border: 1px solid rgba(0, 240, 255, 0.35);
  color: #00f0ff;
  cursor: pointer;
  margin-inline-start: 8px;
  transition: all 0.2s ease;
  font-family: inherit;
}
.copy-btn:hover {
  background: rgba(0, 240, 255, 0.3);
}

/* Empty Box */
.empty-box {
  text-align: center;
  padding: 45px 20px;
  color: #94a3b8;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(10, 15, 29, 0.85) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
}
.empty-box-icon {
  font-size: 48px;
  margin-block-end: 12px;
}
</style>

<div class="track-page" dir="ltr">

  <!-- ═══════════════ HERO ═══════════════ -->
  <div class="track-hero">
    <h1 class="track-hero-title">📊 Track Job Postings & Applicants</h1>
    <p class="track-hero-subtitle">Real-time recruiter monitoring dashboard — view posted positions, live impressions, candidate submission logs, and CV applications.</p>
    <div class="track-options-bar">
      <label class="track-option-pill">
        <input dir="auto" type="checkbox" id="notifyCheck" style="accent-color:#00f0ff;" onchange="toggleNotifications()">
        <span>📩 Notify me via email instantly when a new candidate applies</span>
      </label>
      <label class="track-option-pill">
        <input dir="auto" type="checkbox" id="liveRefresh" style="accent-color:#a855f7;" onchange="toggleLiveRefresh()">
        <span>🔄 Auto-refresh live feed every 30s</span>
      </label>
    </div>
  </div>

  <!-- ═══════════════ SEARCH CARD ═══════════════ -->
  <div class="track-search-card">
    <h2 class="track-search-title">🔍 Search Posted Jobs & Applicants</h2>
    <div class="track-form-group">
      <label class="track-label">📧 Employer / Recruiter Email *</label>
      <input dir="auto" type="email" id="trackEmail" class="track-input" placeholder="hr@yourcompany.com" required>
    </div>
    <div class="track-form-group">
      <label class="track-label">🆔 Job ID (Optional — for a specific listing)</label>
      <input dir="auto" type="text" id="trackJobId" class="track-input" placeholder="job_xxxxxxxxxxxx">
    </div>
    <button class="track-btn" onclick="trackJobs()">🔍 Search Jobs & Applicants</button>
    <div id="trackMsg" style="text-align:center; margin-block-start:12px; display:none; font-size:13.5px; font-weight:700;"></div>
  </div>

  <!-- ═══════════════ RESULTS CONTAINER ═══════════════ -->
  <div id="resultsArea"></div>

</div>

<script>
const API = '';
let currentEmail = '';
let currentJobId = '';
let liveRefreshTimer = null;

function trackJobs() {
  currentEmail = document.getElementById('trackEmail').value.trim();
  currentJobId = document.getElementById('trackJobId').value.trim();
  const btn = document.querySelector('.track-btn');
  
  if (!currentEmail) {
    showMsg('Please enter your recruiter email address.', '#ef4444');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '⏳ Searching Live Database...';
  
  loadDashboard(currentEmail, currentJobId).then(() => {
    btn.disabled = false;
    btn.textContent = '🔍 Search Jobs & Applicants';
    loadNotificationPref(currentEmail);
  });
}

function loadDashboard(email, jobId) {
  let url = `${API}/api/employer/dashboard?email=${encodeURIComponent(email)}`;
  if (jobId) url += `&job_id=${encodeURIComponent(jobId)}`;
  
  return fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        renderJobs(data.jobs, email);
      } else {
        showMsg('❌ ' + (data.message || 'No job listings found for this email.'), '#ef4444');
        document.getElementById('resultsArea').innerHTML = '';
      }
    })
    .catch(err => {
      showMsg('❌ Server connection error.', '#ef4444');
    });
}

function toggleNotifications() {
  if (!currentEmail) return;
  const checked = document.getElementById('notifyCheck').checked ? 1 : 0;
  const formData = new FormData();
  formData.append('email', currentEmail);
  formData.append('notify_email', checked);
  
  fetch(`${API}/api/employer/preferences`, { method:'POST', body:formData })
    .then(r => r.json())
    .then(data => {
      const label = document.querySelector('#notifyCheck').parentElement.querySelector('span');
      label.textContent = checked ? '📩 ✅ Instant Email Notifications Enabled' : '📩 Notify me via email instantly when a new candidate applies';
    });
}

function loadNotificationPref(email) {
  fetch(`${API}/api/employer/preferences?email=${encodeURIComponent(email)}`)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok' && data.preferences) {
        const on = data.preferences.notify_email === 1 || data.preferences.notify_email === '1';
        document.getElementById('notifyCheck').checked = on;
        const label = document.querySelector('#notifyCheck').parentElement.querySelector('span');
        label.textContent = on ? '📩 ✅ Instant Email Notifications Enabled' : '📩 Notify me via email instantly when a new candidate applies';
      }
    });
}

function toggleLiveRefresh() {
  const checked = document.getElementById('liveRefresh').checked;
  if (checked) {
    startLiveRefresh();
  } else {
    stopLiveRefresh();
  }
}

function startLiveRefresh() {
  stopLiveRefresh();
  liveRefreshTimer = setInterval(() => {
    if (currentEmail) {
      loadDashboard(currentEmail, currentJobId);
    }
  }, 30000);
}

function stopLiveRefresh() {
  if (liveRefreshTimer) {
    clearInterval(liveRefreshTimer);
    liveRefreshTimer = null;
  }
}

function renderJobs(jobs, email) {
  const area = document.getElementById('resultsArea');
  if (!jobs || jobs.length === 0) {
    area.innerHTML = '<div class="empty-box"><div class="empty-box-icon">📭</div><h3 style="color:#f1f5f9;margin-bottom:8px;">No Job Postings Found</h3><p>No job postings found for <strong style="color:#00f0ff;">' + escapeHtml(email) + '</strong>.<br>Post a new opening from the Employer Portal.</p></div>';
    showMsg('', '');
    return;
  }
  
  const totalViews = jobs.reduce((s,j) => s+(j.views||0),0);
  const totalApps = jobs.reduce((s,j) => s+(j.applications||0),0);
  
  let html = '<div style="margin-block-start:10px;"><h2 style="font-size:22px;font-weight:800;color:#f1f5f9;margin-block-end:14px;">📋 ' + jobs.length + ' Job Postings for ' + escapeHtml(email) + '</h2>';
  html += '<div style="display:flex;gap:12px;margin-block-end:20px;flex-wrap:wrap;">';
  html += '<div class="stat-badge views">👁️ ' + totalViews + ' Total Impressions</div>';
  html += '<div class="stat-badge apps">📩 ' + totalApps + ' Total Applicant Submissions</div>';
  html += '</div>';
  
  jobs.forEach(j => {
    const created = j.created_at ? new Date(j.created_at.replace(' ','T')+'Z') : null;
    const expires = j.expires_at ? new Date(j.expires_at.replace(' ','T')+'Z') : null;
    const now = new Date();
    const totalDays = expires && created ? (expires-created)/(86400000) : 30;
    const daysLeft = expires ? Math.max(0, Math.ceil((expires-now)/86400000)) : 0;
    const pctLeft = totalDays > 0 ? Math.min(100, Math.max(0, (daysLeft/totalDays)*100)) : 0;
    
    html += '<div class="job-card">';
    html += '<div class="job-card-header">';
    html += '<div><div class="job-card-title">' + escapeHtml(j.job_title) + '</div>';
    html += '<div class="job-card-company">🏢 ' + escapeHtml(j.company_name) + ' · 📍 ' + escapeHtml(j.location) + '</div></div>';
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
    html += '<span class="stat-badge tier">' + (j.tier||'basic').toUpperCase() + '</span>';
    html += '<span class="stat-badge status">' + getStatusLabel(j) + '</span>';
    html += '</div></div>';
    
    html += '<div class="job-card-meta">';
    html += '<span>🗓️ Published: ' + (created ? created.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : 'N/A') + '</span>';
    html += '<span>⏰ Expires: ' + (expires ? expires.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : 'N/A') + '</span>';
    html += '<span>💰 Budget: $' + (j.price||0).toFixed(2) + '</span>';
    if (j.duration_days) html += '<span>📅 ' + j.duration_days + 'd listing</span>';
    html += '</div>';
    
    html += '<div class="job-actions-row">';
    html += '<span class="stat-badge views">👁️ ' + (j.views||0) + ' Impressions</span>';
    html += '<span class="stat-badge apps">📩 ' + (j.applications||0) + ' Applications</span>';
    html += '<button class="btn-action-details" onclick="toggleDetail('detail_' + j.job_id + '')">📋 Listing Details ▼</button>';
    html += '</div>';
    
    // Details
    html += '<div class="detail-section" id="detail_' + j.job_id + '">';
    html += '<div class="detail-grid">';
    html += '<div class="detail-box"><div class="label">Job ID</div><div class="value">' + j.job_id + '<button class="copy-btn" onclick="copyText('' + j.job_id + '')">Copy</button></div></div>';
    html += '<div class="detail-box"><div class="label">Category</div><div class="value">' + (j.category||'N/A') + '</div></div>';
    html += '<div class="detail-box"><div class="label">Salary Range</div><div class="value">' + (j.salary||'Not specified') + '</div></div>';
    html += '<div class="detail-box"><div class="label">Contact</div><div class="value">' + escapeHtml(j.contact_email) + '</div></div>';
    html += '<div class="detail-box full"><div class="label">Job Description</div><div class="value" style="white-space:pre-wrap;max-block-size:140px;overflow-y:auto;">' + escapeHtml(j.description||'') + '</div></div>';
    if (j.apply_url) html += '<div class="detail-box full"><div class="label">Direct Apply Link</div><div class="value"><a href="' + escapeHtml(j.apply_url) + '" target="_blank" style="color:#00f0ff;">' + escapeHtml(j.apply_url) + '</a></div></div>';
    html += '<div class="detail-box full"><div class="label">Permanent Tracking Link</div><div class="value"><a href="' + window.location.origin + '/employer/track?email=' + encodeURIComponent(j.contact_email) + '&job_id=' + j.job_id + '" style="color:#00f0ff;">' + window.location.origin + '/employer/track?email=' + encodeURIComponent(j.contact_email) + '&job_id=' + j.job_id + '</a> <button class="copy-btn" onclick="copyText('' + window.location.origin + '/employer/track?email=' + encodeURIComponent(j.contact_email) + '&job_id=' + j.job_id + '')">Copy</button></div></div>';
    html += '</div></div>';
    
    html += '</div>';
  });
  
  html += '</div>';
  area.innerHTML = html;
  showMsg('✅ Successfully loaded ' + jobs.length + ' job listing(s)!', '#22c55e');
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function getStatusLabel(j) {
  if (!j.expires_at) return 'Active';
  const exp = new Date(j.expires_at.replace(' ','T')+'Z');
  if (exp < new Date()) return '⏰ Expired';
  return '✅ Active';
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('Link copied to clipboard!');
  }).catch(() => {});
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

function showMsg(text, color) {
  const div = document.getElementById('trackMsg');
  div.textContent = text;
  div.style.color = color;
  div.style.display = text ? 'block' : 'none';
}

(function() {
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  const jobId = params.get('job_id');
  if (email) {
    document.getElementById('trackEmail').value = email;
    if (jobId) document.getElementById('trackJobId').value = jobId;
    trackJobs();
  }
})();
</script>
