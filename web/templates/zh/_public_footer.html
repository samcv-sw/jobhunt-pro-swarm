<div id="liveSocialProofTicker" style="position:fixed; inset-block-end:24px; inset-inline-start:24px; z-index:9999; display:none; max-inline-size:360px; background:rgba(15,23,42,0.92); border:1px solid rgba(56,189,248,0.35); border-radius:16px; padding:12px 16px; box-shadow:0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(56,189,248,0.15); backdrop-filter:blur(12px); font-family:sans-serif; transition:all 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform:translateY(30px); opacity:0;" dir="ltr">
  <div style="display:flex; align-items:flex-start; gap:12px;">
    <div style="inline-size:38px; block-size:38px; border-radius:10px; background:linear-gradient(135deg, #06b6d4, #3b82f6); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 4px 10px rgba(6,182,212,0.3);">
      <span id="tickerIcon">⚡</span>
    </div>
    <div style="flex:1;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-block-end:2px;">
        <span style="font-size:11px; font-weight:800; color:#38bdf8; display:flex; align-items:center; gap:5px;">
          <span style="inline-size:6px; block-size:6px; border-radius:50%; background:#10b981; display:inline-block;"></span>
          实时成交提卡
        </span>
        <button type="button" onclick="closeSocialProofTicker()" style="background:none; border:none; color:#64748b; font-size:14px; cursor:pointer; padding:0 4px;">✕</button>
      </div>
      <div id="tickerMsg" style="font-size:12.5px; font-weight:700; color:#f8fafc; line-height:1.4;">
        来自上海的求职者刚刚成功激活 Pro VIP 套餐
      </div>
      <div id="tickerTime" style="font-size:10.5px; color:#94a3b8; margin-block-start:3px;">
        3分钟前 · 已验真
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const eventsZh = [
      { icon: '⚡', msg: '来自上海的求职者刚刚成功激活 Pro VIP 套餐', time: '3分钟前 · 已验真' },
      { icon: '💎', msg: '来自深圳的用户开启了 1,000 家企业 AI 精准直投', time: '5分钟前 · 实时投递' },
      { icon: '🚀', msg: '来自北京的外企应聘者已自动直投 350 份外企高薪岗位', time: '1分钟前 · 极速发卡' },
      { icon: '👑', msg: '来自杭州的工作室批量采购了 10 张企业 B2B 激活券', time: '8分钟前 · 已验真' },
      { icon: '🎯', msg: '广州客户在使用自动投递 16 小时后收到首轮面试邀请', time: '12分钟前 · 极速求职' }
    ];

    let idx = 0;
    const ticker = document.getElementById('liveSocialProofTicker');
    if (!ticker) return;

    function showTicker() {
      const ev = eventsZh[idx % eventsZh.length];
      idx++;
      document.getElementById('tickerIcon').innerText = ev.icon;
      document.getElementById('tickerMsg').innerText = ev.msg;
      document.getElementById('tickerTime').innerText = ev.time;
      
      ticker.style.display = 'block';
      setTimeout(() => {
        ticker.style.opacity = '1';
        ticker.style.transform = 'translateY(0)';
      }, 50);

      setTimeout(() => {
        ticker.style.opacity = '0';
        ticker.style.transform = 'translateY(30px)';
        setTimeout(() => { ticker.style.display = 'none'; }, 400);
      }, 5500);
    }

    window.closeSocialProofTicker = function() {
      ticker.style.opacity = '0';
      ticker.style.transform = 'translateY(30px)';
      setTimeout(() => { ticker.style.display = 'none'; }, 400);
    };

    setTimeout(() => {
      showTicker();
      setInterval(showTicker, 18000);
    }, 4000);
  })();
</script>
