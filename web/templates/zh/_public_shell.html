    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="preload" as="style" onload="this.rel='stylesheet'">
    <style>
        :root{--bg:#0a0a0f;--surface:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);--border-light:rgba(255,255,255,.06);--blue:#3b82f6;--blue-dim:rgba(59,130,246,.15);--green:#22c55e;--gold:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--text:#e2e8f0;--text-dim:#94a3b8;--text-muted:#64748b;--radius:12px;--radius-lg:16px;--radius-xl:20px;--shadow:0 4px 16px rgba(0,0,0,.25);--transition:all .2s ease}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif, 'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-block-size:100vh;line-height:1.6}
        a{color:var(--blue);text-decoration:none;transition:var(--transition)}
        a:hover{color:#60a5fa}
        h1{font-size:32px;font-weight:800;margin-block-end:8px}
        h2{font-size:22px;font-weight:700;margin-block-end:12px}
        h3{font-size:17px;font-weight:600;margin-block-end:8px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-block-end:16px;transition:var(--transition)}
        .card:hover{border-color:var(--border);box-shadow:var(--shadow)}
        .card-title{font-size:17px;font-weight:600;color:var(--text);margin-block-end:14px;display:flex;align-items:center;gap:10px}
        .glass{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);padding:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
        .glass:hover{border-color:var(--border);box-shadow:var(--shadow)}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif, 'Inter',sans-serif;text-decoration:none}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--blue-dim)}
        .btn-sm{padding:7px 14px;font-size: 14px}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
        .btn-outline:hover{background:rgba(255,255,255,.04)}
        .text-dim{color:var(--text-dim)}
        .text-muted{color:var(--text-muted)}
        .text-center{text-align:center}
        .grid{display:grid;gap:16px}
        .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
        .grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
        .flex{display:flex;gap:12px;align-items:center}
        .flex-wrap{flex-wrap:wrap}
        .mb-8{margin-block-end:8px}
        .mb-16{margin-block-end:16px}
        .mb-24{margin-block-end:24px}
        .mt-16{margin-block-start:16px}
        .mt-24{margin-block-start:24px}
        .p-24{padding:24px}
        .gap-8{gap:8px}
        .gap-12{gap:12px}
        .max-w-800{max-inline-size:800px;margin-inline-start:auto;margin-inline-end:auto}
        .max-w-1200{max-inline-size:1200px;margin-inline-start:auto;margin-inline-end:auto}
        .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size: 14px;font-weight:600}
        .tag-blue{background:var(--blue-dim);color:#60a5fa}
        .tag-green{background:rgba(34,197,94,.12);color:#4ade80}
        .tag-gold{background:rgba(245,158,11,.12);color:#fbbf24}
        .tag-purple{background:rgba(139,92,246,.12);color:#c4b5fd}
        @media(max-width:768px){h1{font-size:26px}.card{padding:18px}.grid-2,.grid-3{grid-template-columns:1fr}}
        .headroom{min-block-size:60px;background:rgba(10,10,15,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-inset-block-end:1px solid var(--border-light);position:sticky;inset-block-start:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
        .headroom .brand{font-size:18px;font-weight:800;color:var(--blue);}
        .headroom nav{display:flex;gap:18px}
        .headroom nav a{font-size: 14px;color:var(--text-muted);font-weight:500;padding:6px 0;border-inset-block-end:2px solid transparent}
        .headroom nav a:hover{border-color:var(--blue);color:var(--text)}

        .contact-hero .subtitle{color:#94a3b8;font-size:15px;max-inline-size:600px;margin:0 auto}
        .contact-alert{padding:14px 20px;border-radius:12px;margin-block-end:24px;font-size:14px;font-weight:500}

        .response-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);border-radius:50px;padding:8px 20px;font-size: 14px;color:#94a3b8;margin-block-end:32px}
        .pulse-dot{inline-size:8px;block-size:8px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-block-start:8px}
        .form-panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px}
        .form-panel h2{font-size:18px;font-weight:700;margin-block-end:6px}
        .form-subtitle{font-size: 14px;color:#64748b;margin-block-end:24px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-block-end:0}
        .form-group{margin-block-end:18px}
        .form-group label{display:block;font-size: 14px;color:#94a3b8;margin-block-end:7px;font-weight:500}
        .glass-input{inline-size:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e2e8f0;font-size:14px;font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif, 'Inter',sans-serif;transition:all .25s;resize:vertical}
        .glass-input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        textarea.glass-input{min-block-size:130px}
        .btn-submit{inline-size:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;font-family:'Cairo', 'IBM Plex Arabic', 'Tajawal', sans-serif, 'Inter',sans-serif}
        .btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(59,130,246,.35)}
        .support-cards{display:flex;flex-direction:column;gap:14px}
        .support-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;text-decoration:none;color:inherit;transition:all .25s;display:block}
        .support-card:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);transform:translateY(-2px)}
        .support-card.whatsapp:hover{border-color:rgba(37,211,102,.2)}
        .sc-icon{font-size:28px;margin-block-end:10px;display:block}
        .support-card h3{font-size:14px;font-weight:700;margin-block-end:6px;color:#e2e8f0}
        .support-card p{font-size: 14px;color:#94a3b8;line-height:1.7}
        .hours-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:22px}
        .hours-card h3{font-size:14px;font-weight:700;margin-block-end:14px;color:#e2e8f0}
        .hours-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-inset-block-end:1px solid rgba(255,255,255,.05)}
        .hours-row:last-child{border-inset-block-end:none}
        .day{font-size: 14px;color:#94a3b8}
        .time{font-size: 14px;font-weight:600;color:#64748b}
        .time.highlight{color:#22c55e}
        .wa-float{position:fixed;inset-block-end:28px;inset-inline-end:28px;background:#25d366;color:#fff;padding:12px 22px;border-radius:50px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.35);z-index:999;display:flex;align-items:center;gap:8px;transition:all .25s}
        .wa-float:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(37,211,102,.5);color:#fff}
        @media(max-width:768px){.contact-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
        /* Services Page Styles (when loaded in public shell) */
        .services-container{max-inline-size:1100px;margin:0 auto;padding:40px 20px 80px}
    </style>
</head>
<body>
    {% include "zh/_public_nav.html" %}

    <script>

    <!-- GROWTH HACK: Apex Glassmorphism Exit-Intent Modal -->
    <div id="exitPopup" style="display:none; position:fixed; inset-block-start:0; inset-inline-start:0; inline-size:100vw; block-size:100vh; background:rgba(3, 7, 18, 0.85); z-index:99999; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
        <div style="background:linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(10, 15, 30, 0.98)); padding:36px 32px; border-radius:24px; border:1px solid rgba(0, 240, 255, 0.28); max-inline-size:460px; inline-size:100%; text-align:center; position:relative; box-shadow:0 25px 60px -15px rgba(0, 240, 255, 0.2), 0 0 50px rgba(139, 92, 246, 0.18); font-family:'Space Grotesk', 'Inter', sans-serif;">

            <!-- Close Button -->
            <button id="exit-popup-close-btn" onclick="document.getElementById('exitPopup').style.display='none'" style="position:absolute; inset-block-start:16px; inset-inline-end:16px; inline-size:36px; block-size:36px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#94a3b8; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; outline:none; z-index:10;" onmouseover="this.style.background='rgba(239,68,68,0.2)'; this.style.color='#f87171'; this.style.borderColor='rgba(239,68,68,0.4)'; this.style.transform='rotate(90deg)';" onmouseout="this.style.background='rgba(255,255,255,0.06)'; this.style.color='#94a3b8'; this.style.borderColor='rgba(255,255,255,0.12)'; this.style.transform='rotate(0deg)';">✕</button>

            <!-- Top Pill Badge -->
            <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:rgba(0,240,255,0.1); border:1px solid rgba(0,240,255,0.3); border-radius:30px; font-size:12px; font-weight:800; color:#00f0ff; letter-spacing:0.5px; text-transform:uppercase; margin-block-end:16px; position:relative; z-index:1;">
                <span>🎁</span>
                <span>FREE 2026 VIP BLUEPRINT</span>
            </div>

            <!-- Main Headline -->
            <h2 style="font-size:23px; font-weight:900; line-height:1.35; margin:0 0 10px 0; color:#ffffff; position:relative; z-index:1;">
                等等！离开前领取您的专属求职秘籍 🚀
            </h2>

            <!-- Persuasive Subtext -->
            <p style="color:#cbd5e1; margin:0 0 22px 0; font-size:14px; line-height:1.65; position:relative; z-index:1;">
                立即免费获取<strong>《2026 全球与海湾地区 ATS 穿透指南》</strong>，已助力 <strong>15,000+</strong> 候选人斩获高薪 Offer。<span style="color:#00f0ff; font-weight:700;">（100% 免费 — 绝无隐形费用）</span>
            </p>

            <!-- Form -->
            <form dir="auto" onsubmit="event.preventDefault(); this.innerHTML='<div style=\'padding:16px; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); border-radius:14px; color:#4ade80; font-weight:800; font-size:15px;\'>🎉 领取成功！指南已发送至您的邮箱，请在 60 秒内查收。</div>';" style="position:relative; z-index:1;">
                <div style="position:relative; margin-block-end:12px;">
                    <input id="exit-popup-email-input" type="email" placeholder="输入您的常用电子邮箱..." dir="auto" required style="inline-size:100%; padding:14px 16px; background:rgba(15, 23, 42, 0.8); border:1px solid rgba(0, 240, 255, 0.25); border-radius:12px; color:#ffffff; font-family:inherit; font-size:14px; box-sizing:border-box; outline:none; transition:all 0.25s ease;" onfocus="this.style.borderColor='#00f0ff'; this.style.boxShadow='0 0 15px rgba(0,240,255,0.35)';" onblur="this.style.borderColor='rgba(0, 240, 255, 0.25)'; this.style.boxShadow='none';">
                </div>
                <button id="exit-popup-submit-btn" type="submit" style="inline-size:100%; padding:15px 20px; background:linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%); color:#050515; border:none; border-radius:12px; font-weight:900; font-size:15px; font-family:inherit; cursor:pointer; transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow:0 0 25px rgba(0, 240, 255, 0.45); display:flex; align-items:center; justify-content:center; gap:8px;" onmouseover="this.style.transform='translateY(-2px) scale(1.02)'; this.style.boxShadow='0 0 35px rgba(0, 240, 255, 0.7)';" onmouseout="this.style.transform='translateY(0) scale(1)'; this.style.boxShadow='0 0 25px rgba(0, 240, 255, 0.45)';" onmousedown="this.style.transform='scale(0.98)';">
                    <span>⚡ 立即免费发送给我 🚀</span>

            <!-- Trust Badges Strip -->
            <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-block-start:16px; font-size:12px; color:#94a3b8; position:relative; z-index:1;">
                <span style="display:flex; align-items:center; gap:4px;">🔒 100% 免费</span>

                <span style="display:flex; align-items:center; gap:4px;">⚡ 即时送达</span>
                <span>•</span>
                <span style="display:flex; align-items:center; gap:4px;">🛡️ 零垃圾邮件</span>
            </div>
        </div>
    </div>
    <script>
(function(){
  let exitShown = false;
  let inactivityTimer = null;
  const INACTIVITY_DELAY = 180000; // Exactly 3 minutes (180,000 ms) of complete inactivity

  function resetInactivityTimer() {
    if (exitShown) return;
    
    // Clear existing timer whenever user moves/scrolls/types/clicks/touches
    if (inactivityTimer) {
      clearTimeout(inactivityTimer);
    }
    
    // Start new 3-minute countdown of complete zero activity
    inactivityTimer = setTimeout(function() {
      if (!exitShown) {
        triggerExitPopup();
      }
    }, INACTIVITY_DELAY);
  }

  // Listen to all user activity events. Any movement resets timer back to 0!
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'touchmove', 'click'].forEach(function(evtName) {
    window.addEventListener(evtName, resetInactivityTimer, { passive: true });
  });

  // Initial call on page load
  resetInactivityTimer();

  window.triggerExitPopup = function(){
    if (window.canShowExitPopup && !window.canShowExitPopup()) return;
    if (window.IS_LOGGED_IN || document.cookie.includes('session') || document.cookie.includes('token')) return;

    const lastShown = localStorage.getItem('exit_popup_last_shown');
    const now = 日期.now();
    if (lastShown && (now - parseInt(lastShown)) < 180000) return;

    if (exitShown) return;
    exitShown = true;
    if (window.recordExitPopupShown) window.recordExitPopupShown();
    localStorage.setItem('exit_popup_last_shown', now.toString());
    const overlay = document.getElementById('exitOverlay') || document.getElementById('exitPopup');
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.classList.add('show');
    }
  };

  window.closeExitPopup = function(){
    if (window.recordExitPopupShown) window.recordExitPopupShown();
    const overlay = document.getElementById('exitOverlay') || document.getElementById('exitPopup');
    if (overlay) {
      overlay.style.display = 'none';
      overlay.classList.remove('show');
    }
  };
})();
</script>

<script>
// Exit-Intent Rate Limiter & Authentication Check (Max 1 appearance every 3 minutes for guests)
(function(){
    function canShowPopup() {
        if (window.IS_LOGGED_IN || document.cookie.includes('session') || document.cookie.includes('token') || document.cookie.includes('auth')) {
            return false;
        }
        const lastShown = localStorage.getItem('exit_popup_last_shown');
        if (lastShown) {
            const timeDiff = 日期.now() - parseInt(lastShown, 10);
            if (timeDiff < 180000) { // 3 minutes = 180,000 ms
                return false;
            }
        }
        return true;
    }

    window.canShowExitPopup = canShowPopup;
    window.recordExitPopupShown = function() {
        localStorage.setItem('exit_popup_last_shown', 日期.now().toString());
    };
})();

// Background Autopilot Sync across all SaaS pages
(function(){
    const AUTOPILOT_CYCLE_MS = 75000;
    function checkAndRunBackgroundScan() {
        if (document.getElementById('autopilot-countdown')) return; // Battle Station handles its own UI loop
        const stored = localStorage.getItem('autopilot_next_scan_target');
        if (!stored) return;
        const target = parseInt(stored, 10);
        const now = 日期.now();
        if (target && target <= now) {
            // Target expired while on another page — dispatch cloud-tick scan
            localStorage.setItem('autopilot_next_scan_target', (now + AUTOPILOT_CYCLE_MS).toString());
            fetch('/api/v2/cloud-tick', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company_limit: 3, max_campaigns: 3 })
            }).catch(function(err){ console.debug('Global background scan trigger:', err); });
        }
    }
    setInterval(checkAndRunBackgroundScan, 5000);
})();
</script>
