<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <title>تسجيل الدخول باستخدام حساب Google</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"/>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', 'Cairo', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f1011;
      color: #e3e3e3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .google-card {
      background: #18191b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: 100%;
      max-width: 540px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
    }
    .google-logo {
      width: 44px;
      height: 44px;
      margin-bottom: 20px;
    }
    .google-title {
      font-size: 30px;
      font-weight: 500;
      color: #f1f3f4;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      font-family: 'Roboto', 'Cairo', sans-serif;
    }
    .google-subtitle {
      font-size: 15px;
      color: #9aa0a6;
      margin-bottom: 24px;
    }
    .account-list {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
    }
    .account-form {
      margin: 0;
      width: 100%;
    }
    .account-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.15s ease;
      text-align: start;
    }
    .account-btn:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }
    .account-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }
    .avatar-sam { background: #1b873f; }
    .avatar-orange { background: #e37400; }
    .avatar-purple { background: #8430ce; }
    .avatar-blue { background: #1a73e8; }
    .avatar-grey { background: #5f6368; }
    .avatar-red { background: #c5221f; }
    .avatar-brown { background: #b06000; }
    .avatar-plus { background: #3c4043; font-size: 22px; }

    .account-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-name {
      font-size: 16px;
      font-weight: 500;
      color: #e8eaed;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-admin {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .account-email {
      font-size: 14px;
      color: #9aa0a6;
      font-family: 'Roboto', 'Cairo', sans-serif;
    }
    .signed-out-tag {
      font-size: 13px;
      color: #9aa0a6;
      font-weight: 400;
      padding-inline-start: 12px;
      flex-shrink: 0;
    }
    .custom-form-container {
      display: none;
      background: #202124;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
    .form-group {
      margin-bottom: 14px;
      text-align: start;
    }
    .input-label {
      display: block;
      font-size: 13px;
      color: #bdc1c6;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: #131314;
      border: 1px solid #5f6368;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: #8ab4f8;
    }
    .btn-submit-custom {
      width: 100%;
      padding: 12px;
      background: #8ab4f8;
      color: #131314;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit-custom:hover {
      background: #aecbfa;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #8ab4f8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="google-card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>

    <h1 class="google-title">Choose an account</h1>
    <p class="google-subtitle">to continue to JobHunt Pro</p>

    <div class="account-list">

        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-sam">S</div>
            <div class="account-details">
              <span class="account-name">sam <span class="badge-admin">Admin</span></span>
              <span class="account-email">samatou683@gmail.com</span>

          </div>

      </form>

      <!-- 3. Nancy Salameh -->

        <input type="hidden" name="provider" value="google" dir="auto">

        <input type="hidden" name="email" value="salamehnancy88@gmail.com" dir="auto">
        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-purple">N</div>

              <span class="account-name">Nancy Salameh</span>
              <span class="account-email">salamehnancy88@gmail.com</span>

        </button>
      </form>

      <!-- 4. Rita -->
      <form action="/auth/oauth-submit" method="POST" class="account-form">
        <input type="hidden" name="provider" value="google" dir="auto">
        <input type="hidden" name="name" value="Rita" dir="auto">
        <input type="hidden" name="email" value="ritacordahi2@gmail.com" dir="auto">
        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-blue">R</div>
            <div class="account-details">
              <span class="account-name">Rita</span>
              <span class="account-email">ritacordahi2@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>
      </form>

      <!-- 5. Angel abou daher -->
      <form action="/auth/oauth-submit" method="POST" class="account-form">
        <input type="hidden" name="provider" value="google" dir="auto">
        <input type="hidden" name="name" value="Angel abou daher" dir="auto">
        <input type="hidden" name="email" value="angelaboudaher@gmail.com" dir="auto">
        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-grey">A</div>
            <div class="account-details">

            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>
      </form>

      <!-- 6. Heribert Stern -->
      <form action="/auth/oauth-submit" method="POST" class="account-form">
        <input type="hidden" name="provider" value="google" dir="auto">
        <input type="hidden" name="name" value="Heribert Stern" dir="auto">
        <input type="hidden" name="email" value="heribertstern968@gmail.com" dir="auto">
        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-red">H</div>
            <div class="account-details">
              <span class="account-name">Heribert Stern</span>
              <span class="account-email">heribertstern968@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>
      </form>

      <!-- 7. Kolibar rolami -->
      <form action="/auth/oauth-submit" method="POST" class="account-form">
        <input type="hidden" name="provider" value="google" dir="auto">
        <input type="hidden" name="name" value="Kolibar rolami" dir="auto">
        <input type="hidden" name="email" value="luxurystoresvvip@gmail.com" dir="auto">
        <button type="submit" class="account-btn">
          <div class="account-left">
            <div class="account-avatar avatar-brown">K</div>
            <div class="account-details">
              <span class="account-name">Kolibar rolami</span>
              <span class="account-email">luxurystoresvvip@gmail.com</span>
            </div>
          </div>
          <span class="signed-out-tag">Signed out</span>
        </button>
      </form>

      <!-- 8. Use another account -->
      <div class="account-btn" onclick="toggleCustomForm()" style="border-bottom:none;">
        <div class="account-left">
          <div class="account-avatar avatar-plus">+</div>
          <div class="account-details">
            <span class="account-name">Use another account</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Account Input Box -->
    <div id="customForm" class="custom-form-container">
      <form action="/auth/oauth-submit" method="POST">
        <input type="hidden" name="provider" value="google" dir="auto">
        <div class="form-group">
          <label class="input-label" for="custom_name">Name / الاسم</label>
          <input type="text" id="custom_name" name="name" class="form-input" placeholder="Full Name" required dir="auto">
        </div>
        <div class="form-group">
          <label class="input-label" for="custom_email">Email / البريد الإلكتروني</label>
          <input type="email" id="custom_email" name="email" class="form-input" placeholder="name@gmail.com" required dir="auto">
        </div>
        <button type="submit" class="btn-submit-custom">Sign in / تسجيل الدخول</button>
      </form>
    </div>

    <a href="/login" class="back-link">← Back to Login</a>
  </div>

  <script>
    function toggleCustomForm() {
      const box = document.getElementById('customForm');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
      if (box.style.display === 'block') {
        document.getElementById('custom_name').focus();
      }
    }
  </script>
</body>
</html>
