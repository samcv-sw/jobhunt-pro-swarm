    <div class="check-icon" id="modalIcon" style="font-size: 52px; margin-bottom: 16px;">✅</div>
    <h2 id="modalTitle" style="font-family: 'Cairo', 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px;">تم الشراء!</h2>
    <p id="modalMsg" style="font-family: 'Cairo', 'Tajawal', sans-serif; font-size: 15px; color: #cbd5e1; line-height: 1.6; margin-bottom: 24px;">تم إضافة طلباتك لحسابك.</p>
    <button class="btn" id="modalActionBtn" onclick="closeModal()" style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00f0ff, #00a0cc); color: #030814; font-family: 'Cairo', 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s;">فهمت 👍</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let services = [];
let bouquets = [];
let cart = {}; // { id: { type: 'service'|'bouquet', name, price } }
let activeCat = 'all';

// Category mapping (based on service IDs)
const CATEGORIES = {
  'cv-review': 'resume', 'cv-optimization': 'resume', 'cover-letter-basic': 'resume',
  'skill-gap-report': 'resume', 'cv-keyword': 'resume',
  'email-template': 'email', 'followup-sequence': 'email', 'application-review': 'email',
  'job-alert-setup': 'career', 'response-tracker': 'career', 'job-search-plan': 'career',
  'full-application-pack': 'career', 'company-research': 'career',
  'networking-plan': 'career', 'linkedin-headline': 'career', 'linkedin-optimization': 'career',
  'salary-benchmark': 'ai', 'salary-negotiation': 'ai', 'interview-prep': 'ai',
  'career-consultation': 'ai', 'vip-support-month': 'ai',
};

const CAT_ICONS = {
  'resume': '📄', 'email': '📧', 'career': '🚀', 'ai': '🤖', 'bundles': '🎁'
};

const SERVICE_ICONS = {
  'cv-review': '📋', 'email-template': '✉️', 'cover-letter-basic': '📝',
  'linkedin-headline': '🔗', 'job-alert-setup': '🔔', 'skill-gap-report': '📊',
  'response-tracker': '📈', 'cv-optimization': '🎯', 'company-research': '🔍',
  'followup-sequence': '📬', 'application-review': '✅', 'networking-plan': '🤝',
  'salary-benchmark': '💰', 'linkedin-optimization': '💼', 'interview-prep': '🎤',
  'career-consultation': '🧭', 'full-application-pack': '📦', 'salary-negotiation': '💎',
  'job-search-plan': '📅', 'vip-support-month': '👑',
};

// ═══════════════════════════════════════════════
// DATA FETCHING
// ═══════════════════════════════════════════════
async function loadServices() {
  try {
    const resp = await fetch('/api/v2/services');
    if (!resp.ok) throw new Error('Failed to load');
    const data = await resp.json();
    if (!data.success) throw new Error('API error');
    services = data.services || [];
    bouquets = data.bouquets || [];
    document.getElementById('svcCount').textContent = services.length;
    document.getElementById('bdlCount').textContent = bouquets.length;
  } catch (e) {
    console.error('Load error:', e);
    const container = document.getElementById('svcGrid');
    if (container) {
      container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;background:rgba(255,0,85,0.08);border:1px solid rgba(255,0,85,0.2);border-radius:16px;color:#ff3366;"><p style="font-weight:700;margin-bottom:12px;">حدث خطأ أثناء تحميل الخدمات. يرجى المحاولة مرة أخرى.</p><button onclick="location.reload()" class="btn btn-sm" style="background:#ff0055;color:#fff;">إعادة التحميل 🔄</button></div>';
    }
  }

  // Hide skeletons, show content
  document.getElementById('svcSkeleton').style.display = 'none';
  document.getElementById('bdlSkeleton').style.display = 'none';
  renderAll();
}

// ═══════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════
function getSvcIcon(svc) {
  return SERVICE_ICONS[svc.id] || '⚡';
}

function getSvcCategory(svc) {
  return svc.category || CATEGORIES[svc.id] || 'resume';
}

function renderAll() {
  renderServices();
  renderBundles();
}

function renderServices() {
  const grid = document.getElementById('svcGrid');
  const noRes = document.getElementById('noResults');

  let filtered = services;
  if (activeCat !== 'all' && activeCat !== 'bundles') {
    filtered = services.filter(s => getSvcCategory(s) === activeCat);
  }

  if (filtered.length === 0) {
    grid.style.display = 'none';
    noRes.style.display = 'block';
    return;
  }

  noRes.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = filtered.map(s => {
    const icon = getSvcIcon(s);
    const inCart = cart[s.id] !== undefined;
    const nameStr = s.name_ar || s.name;
    const descStr = s.description_ar || s.description;
    const deliveryStr = s.delivery_ar || s.delivery || 'فوري';
    const featList = s.features_ar || s.features || [];
    const features = featList.slice(0, 3).join(' · ');
    return `
      <div class="svc-card${inCart ? ' in-cart' : ''}" data-id="${s.id}">
        <div class="svc-icon">${icon}</div>
        <h3>${escHtml(nameStr)}</h3>
        <p class="svc-desc">${escHtml(descStr)}</p>
        <div class="svc-meta">
          <span class="svc-delivery">⚡ ${escHtml(deliveryStr)}</span>
        </div>
        ${features ? `<div class="svc-features">${escHtml(features)}</div>` : ''}
        <div class="svc-price-row">
          <span class="svc-price${s.price === 0 ? ' free' : ''}">$${s.price}</span>
          <button class="svc-btn${inCart ? ' in-cart-btn' : ''}" onclick="toggleCartItem('${s.id}','service','${escJs(s.name)}',${s.price})">
            ${inCart ? '✓ بالسلة' : '+ ضيف للسلة'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function renderBundles() {
  const grid = document.getElementById('bdlGrid');
  grid.style.display = 'grid';

  if (activeCat !== 'all' && activeCat !== 'bundles') {
    grid.innerHTML = '';
    return;
  }

  grid.innerHTML = bouquets.map((b, idx) => {
    const inCart = cart[b.id] !== undefined;
    const svcNames = (b.services || []).map(sid => {
      const svc = services.find(s => s.id === sid);
      return svc ? svc.name.split(' ').slice(0, 2).join(' ') : sid;
    });
    const totalOrig = (b.services || []).reduce((sum, sid) => {
      const svc = services.find(s => s.id === sid);
      return sum + (svc ? svc.price : 0);
    }, 0);
    const highlight = (idx === 1 && b.savings) ? ' highlight' : '';
    const badge = idx === 1 ? '<div class="bundle-badge popular">الأكثر طلباً</div>'
                : (idx === 4 ? '<div class="bundle-badge best">أفضل قيمة</div>' : '');
    return `
      <div class="bundle-card${highlight}" data-id="${b.id}">
        ${badge}
        <div class="bundle-icon">🎁</div>
        <h3>${escHtml(b.name)}</h3>
        <p class="bundle-desc">${escHtml(b.description)}</p>
        <div class="bundle-services">${svcNames.map(n => `<span>${escHtml(n)}</span>`).join('')}</div>
        <div class="bundle-price-row">
          <span class="bundle-orig">$${totalOrig || b.price}</span>
          <span class="bundle-price">$${b.price}</span>
          ${b.savings ? `<span class="bundle-savings">وفر ${b.savings}</span>` : ''}
        </div>
        <button class="svc-btn" onclick="toggleCartItem('${b.id}','bouquet','${escJs(b.name)}',${b.price})">
          ${inCart ? '✓ بالسلة' : '+ ضيف للسلة'}
        </button>
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// CATEGORY FILTERING
// ═══════════════════════════════════════════════
document.getElementById('catTabs').addEventListener('click', function(e) {
  if (!e.target.classList.contains('cat-tab')) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  activeCat = e.target.dataset.cat;
  renderAll();
});

// ═══════════════════════════════════════════════
// CART LOGIC
// ═══════════════════════════════════════════════
function toggleCartItem(id, type, name, price) {
  if (cart[id]) {
    delete cart[id];
    showToast('انشال من السلة');
  } else {
    cart[id] = { type, name, price };
    showToast('انضاف للسلة');
  }
  updateCartUI();
  renderAll();
}

function updateCartUI() {
  const items = Object.values(cart);
  const count = items.length;
  const total = items.reduce((s, i) => s + i.price, 0);
  const fabCount = document.getElementById('cartFabCount');
  const cartItems = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartالمجموع');
  const checkoutBtn = document.getElementById('checkoutBtn');

  // FAB badge
  if (count > 0) {
    fabCount.style.display = 'flex';
    fabCount.textContent = count;
  } else {
    fabCount.style.display = 'none';
  }

  // Cart items
  if (count === 0) {
    cartItems.innerHTML = `
      <div class="cart-empty">
        <div class="empty-icon">🛒</div>
        <div class="empty-text">سلتك فاضية<br>ضيف خدمات لتبلش</div>
      </div>`;
    checkoutBtn.disabled = true;
  } else {
    cartItems.innerHTML = Object.entries(cart).map(([id, item]) => `
      <div class="cart-item">
        <div class="cart-item-icon">${item.type === 'bouquet' ? '🎁' : '⚡'}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${escHtml(item.name)}</div>
          <div class="cart-item-type">${item.type}</div>
        </div>
        <span class="cart-item-price">$${item.price}</span>
        <button class="cart-remove" onclick="removeCartItem('${id}')" title="Remove">×</button>
      </div>`).join('');
    checkoutBtn.disabled = false;
  }

  totalEl.textContent = '$' + total;
}

function removeCartItem(id) {
  delete cart[id];
  updateCartUI();
  renderAll();
  showToast('انشال من السلة');
}

function toggleCart() {
  document.getElementById('cartOverlay').classList.toggle('open');
  updateCartUI();
}

function closeCart() {
  document.getElementById('cartOverlay').classList.remove('open');
}

function closeCartOverlay(e) {
  if (e.target === e.currentTarget) closeCart();
}

// ═══════════════════════════════════════════════
// CHECKOUT
// ═══════════════════════════════════════════════
async function checkout() {
  const items = Object.entries(cart);
  if (items.length === 0) return;

  const total = items.reduce((s, [,i]) => s + i.price, 0);
  if (!confirm(`هل ترغب في شراء ${items.length} خدمة/خدمات بإجمالي $${total}؟\nسيتم خصم المبلغ من رصيد محفظتك.`)) return;

  const checkoutBtn = document.getElementById('checkoutBtn');
  checkoutBtn.disabled = true;
  checkoutBtn.textContent = 'جاري المعالجة...';

  // Perform bulk purchase
  const selectedStr = items.map(([id, item]) => `${id}|${item.type}`).join(',');
  const fd = new FormData();
  fd.append('selected_items', selectedStr);

  try {
    const resp = await fetch('/services/purchase-bulk', { method: 'POST', body: fd, redirect: 'follow' });
    const finalUrl = resp.url;

    checkoutBtn.disabled = false;
    checkoutBtn.textContent = 'تابع للدفع';

    // 1. Not logged in redirect
    if (finalUrl.includes('/login')) {
      document.getElementById('modalIcon').textContent = '🔒';
      document.getElementById('modalTitle').textContent = 'يلزم تسجيل الدخول';
      document.getElementById('modalMsg').innerHTML = 'يرجى تسجيل الدخول إلى حسابك أولاً لتتمكن من الشراء واستخدام رصيد المحفظة.';
      const actionBtn = document.getElementById('modalActionBtn');
      actionBtn.textContent = 'تسجيل الدخول الآن ↗';
      actionBtn.style.background = 'linear-gradient(135deg, #00f0ff, #00a0cc)';
      actionBtn.onclick = function() { window.location.href = '/login'; };
      const pm = document.getElementById('purchaseModal'); if (pm) { document.body.appendChild(pm); pm.style.display = 'flex'; pm.classList.add('open'); }
      return;
    }

    // 2. Insufficient funds redirect
    if (finalUrl.includes('error=insufficient_funds')) {
      document.getElementById('modalIcon').textContent = '⚠️';
      document.getElementById('modalTitle').textContent = 'رصيد المحفظة غير كافٍ!';
      document.getElementById('modalMsg').innerHTML = `رصيد محفظتك الحالي غير كافٍ لإتمام العملية بقيمة <strong style="color:#00f0ff;">$${total}</strong>.<br><br>يرجى شحن محفظتك بالرصيد لتفعيل الخدمات المحددة.`;
      const actionBtn = document.getElementById('modalActionBtn');
      actionBtn.textContent = '💳 شحن المحفظة الآن ↗';
      actionBtn.style.background = 'linear-gradient(135deg, #ff0055, #ff5500)';
      actionBtn.onclick = function() { window.location.href = '/pricing'; };
      const pm = document.getElementById('purchaseModal'); if (pm) { document.body.appendChild(pm); pm.style.display = 'flex'; pm.classList.add('open'); }
      return;
    }

    // 3. Other error
    if (finalUrl.includes('error=')) {
      showToast('⚠️ حدث خطأ أثناء عملية الشراء. حاول لاحقاً.', 'error');
      return;
    }

    // 4. Success!
    cart = {};
    updateCartUI();
    renderAll();
    document.getElementById('cartOverlay').classList.remove('open');

    document.getElementById('modalIcon').textContent = '✅';
    document.getElementById('modalTitle').textContent = 'تم الشراء بنجاح!';
    document.getElementById('modalMsg').innerHTML = `تم شراء ${items.length} عنصر/عناصر بنجاح واقتطاع $${total} من محفظتك.<br>الخدمات نشطة الآن في حسابك.`;
    const actionBtn = document.getElementById('modalActionBtn');
    actionBtn.textContent = 'فهمت 👍';
    actionBtn.style.background = 'linear-gradient(135deg, #00f0ff, #00a0cc)';
    actionBtn.onclick = closeModal;
    const pm = document.getElementById('purchaseModal'); if (pm) { document.body.appendChild(pm); pm.style.display = 'flex'; pm.classList.add('open'); }

  } catch (e) {
    checkoutBtn.disabled = false;
    checkoutBtn.textContent = 'تابع للدفع';
    showToast('⚠️ خطأ بالشبكة. يرجى المحاولة مرة أخرى.', 'error');
  }
}

function closeModal() {
  const pm = document.getElementById('purchaseModal'); if (pm) { pm.style.display = 'none'; pm.classList.remove('open'); }
  location.reload();
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + (type || '');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}
function escJs(s) {
  if (!s) return '';
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// ═══════════════════════════════════════════════
// KEYBOARD SHORTCUT
// ═══════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeCart();
  }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadServices();
</script>
