<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>JobHunt Pro AI Copilot</title>
  <style>
    :root {
      --bg: #0a0a16;
      --card: rgba(255,255,255,0.05);
      --border: rgba(0,240,255,0.2);
      --cyan: #00f0ff;
      --gold: #f0c040;
      --green: #22c55e;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 360px; min-height: 440px; background: var(--bg); color: var(--text); padding: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 12px; }
    .logo { font-size: 15px; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 6px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid var(--green); }
    .job-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .job-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .job-company { font-size: 12px; color: var(--cyan); }
    .btn { width: 100%; padding: 9px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; transition: 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #00f0ff, #3b82f6); color: #050b14; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .output-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; font-size: 11px; line-height: 1.5; color: #cbd5e1; max-height: 140px; overflow-y: auto; white-space: pre-wrap; display: none; }
    .footer { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ JobHunt Pro AI</div>
    <div class="status-badge">● متصل</div>
  </div>

  <div class="job-card" id="jobInfo">
    <div class="job-title" id="displayRole">جاري فحص الصفحة الحالية...</div>
    <div class="job-company" id="displayCompany">LinkedIn / Indeed Detector</div>
  </div>

  <button class="btn btn-primary" id="btnGeneratePitch">✨ توليد رسالة تقديم مخصصة بضغطة زر</button>
  <button class="btn btn-secondary" id="btnMatchATS">🎯 فحص نسبة تطابق الـ ATS</button>

  <div class="output-box" id="outputBox"></div>

  <div class="footer">JobHunt Pro Sovereign Swarm v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
