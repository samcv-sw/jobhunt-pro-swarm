name: "24/7 Cloud Swarm Master Orchestrator"

on:
  schedule:
    # Run every 10 minutes (24/7 eternal pulse)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: cloud-247-master-swarm
  cancel-in-progress: false

jobs:
  eternal-orchestration:
    name: "Autonomous 24/7 Cloud Engine"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Critical Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic dnspython jinja2

      - name: Run Cloud Keep-Alive & Health Ping
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://jobhunt-pro.onrender.com' }}
          BACKUP_CLOUD_URL: ${{ secrets.BACKUP_CLOUD_URL || 'https://jobhunt-pro.koyeb.app' }}
        run: |
          python -c "
          import asyncio
          from core.cloud_orchestration_hub import CloudOrchestrationHub

          async def main():
              hub = CloudOrchestrationHub()
              report = await hub.execute_health_pulse()
              print(f'Keepalive Report: {report}')

          asyncio.run(main())
          "

      - name: Run Stealth ATS Harvester & Lead Sync
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import asyncio
          from core.stealth_ats_harvester import StealthAtsHarvester

          async def main():
              harvester = StealthAtsHarvester()
              results = await harvester.harvest_public_ats_targets(query='software engineer', limit=15)
              print(f'Harvested {len(results)} verified leads.')

          asyncio.run(main())
          "
