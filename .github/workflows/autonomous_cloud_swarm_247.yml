name: 24/7 Autonomous Cloud Swarm & Keepalive Sentinel

on:
  schedule:
    # Run every 15 minutes perpetually (0$ GitHub Actions Free Tier: 2,000 mins/month)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  autonomous_pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic

      - name: ⚡ Execute Autonomous Cloud Swarm Pulse
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://jobhunt-pro.onrender.com' }}
          SWARM_SECRET: ${{ secrets.SWARM_SECRET || '0cost-autonomous-swarm-247' }}
        run: |
          python -c "
          import httpx, os, sys

          url = os.getenv('APP_URL')
          secret = os.getenv('SWARM_SECRET')
          headers = {'X-Swarm-Secret': secret, 'User-Agent': 'JobHuntPro-Autonomous-Sentinel/2.0'}

          print(f'Sending keep-alive and autonomous dispatch pulse to: {url}')
          try:
              with httpx.Client(timeout=30.0) as client:
                  # 1. Health check & keep-awake ping
                  r1 = client.get(f'{url}/api/health', headers=headers)
                  print(f'Health Status: {r1.status_code}')

                  # 2. Autonomous Lead Swarm pulse trigger
                  r2 = client.post(f'{url}/api/swarm/autonomous-pulse', headers=headers)
                  print(f'Swarm Pulse Status: {r2.status_code}')
          except Exception as e:
              print(f'Pulse Warning (Non-Fatal): {e}')
          "

      - name: 🛡️ Verify 0$ Zero Memory Footprint
        run: echo "Autonomous pulse completed with 0$ cloud overhead."
