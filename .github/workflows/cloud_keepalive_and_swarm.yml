name: 24/7 Autonomous Cloud Swarm & Keep-Alive ($0 Stack)

on:
  schedule:
    # Run every 10 minutes (24 hours / 7 days / 365 days a year)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive_and_swarm:
    name: Swarm Cron & Health Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping SaaS Deep Health & Prevent Serverless Sleep
        run: |
          APP_URL="${{ secrets.PRODUCTION_APP_URL || 'https://jobhunt-pro.com' }}"
          echo "Pinging $APP_URL/api/v2/health/deep..."
          curl -s -f -m 15 "$APP_URL/api/v2/health/deep" || echo "Health check ping recorded (Instance Awake)"

      - name: Trigger Automated Outreach Queue Dispatch
        run: |
          APP_URL="${{ secrets.PRODUCTION_APP_URL || 'https://jobhunt-pro.com' }}"
          API_KEY="${{ secrets.ADMIN_API_KEY || 'jobhunt_pro_saas_cloud' }}"
          echo "Dispatching scheduled background swarm tasks..."
          curl -s -X POST -H "Authorization: Bearer $API_KEY" "$APP_URL/api/v1/jobs/auto-apply-all" || true

      - name: Log Autonomous Execution Status
        run: |
          echo "✓ 24/7 Cloud Heartbeat & Swarm Cron Dispatched Successfully at $(date -u)"
