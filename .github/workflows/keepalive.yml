name: 24/7 Autonomous Cloud Keep-Alive & Health Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Cloud Ping & Worker Tick
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Sub-5s Keep-Alive Ticks
        env:
          TARGET_URL: ${{ secrets.SITE_URL || 'https://jhfguf.pythonanywhere.com' }}
        run: |
          python -c "
          import urllib.request, time, sys

          urls = [
              f'{TARGET_URL}/health',
              f'{TARGET_URL}/healthz',
              f'{TARGET_URL}/api/v1/health'
          ]
          all_ok = True
          for url in urls:
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'JobHuntPro-KeepAlive/1.0'})
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      elapsed = time.time() - start
                      body = resp.read().decode('utf-8')
                      print(f'[KEEPALIVE] {url} -> {resp.status} in {elapsed:.2f}s | Body: {body[:100]}')
                      if elapsed > 5.0:
                          print(f'[WARN] Ping latency exceeded 5s threshold: {elapsed:.2f}s')
              except Exception as e:
                  print(f'[ERROR] Ping to {url} failed: {e}')
                  all_ok = False

          if not all_ok:
              sys.exit(1)
          "
