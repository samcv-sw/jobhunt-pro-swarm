name: 24/7 Autonomous Cloud Keep-Alive & Health Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Cloud Ping & Worker Tick
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Sub-5s Keep-Alive Ticks
        env:
          TARGET_URL: ${{ secrets.SITE_URL || 'https://jhfguf.pythonanywhere.com' }}
        run: |
          python -c "
          import urllib.request, time

          target_url = '${TARGET_URL}'.rstrip('/')
          health_url = f'{target_url}/health'
          start = time.time()
          try:
              req = urllib.request.Request(health_url, headers={'User-Agent': 'JobHuntPro-KeepAlive/1.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  elapsed = time.time() - start
                  body = resp.read().decode('utf-8')
                  print(f'[KEEPALIVE] {health_url} -> {resp.status} in {elapsed:.2f}s | Body: {body[:100]}')
          except Exception as e:
              print(f'[NOTICE] Soft ping notice for {health_url}: {e}')
          "
