[pytest]
testpaths = tests
norecursedirs = _backups .git .github scratch
python_files = test_*.py
pythonpath = .
asyncio_mode = strict
addopts = -p no:anyio -p no:langsmith -p no:logfire

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::jwt.InsecureKeyLengthWarning



