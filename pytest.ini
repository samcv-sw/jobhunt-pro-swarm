[pytest]
testpaths = tests
norecursedirs = _backups .git .github scratch
python_files = test_*.py
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -p no:anyio -p no:langsmith -p no:logfire -p no:locust

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::jwt.InsecureKeyLengthWarning



