version: '3.8'

services:
  web:
    build: .
    container_name: jobhunt_pro_web
    restart: always
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./jobhunt_pro.db
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: jobhunt_pro_worker
    restart: always
    command: celery -A core.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./jobhunt_pro.db
    depends_on:
      - redis
      - web

  redis:
    image: redis:7-alpine
    container_name: jobhunt_pro_redis
    restart: always
    ports:
      - "6379:6379"

  caddy:
    image: caddy:2-alpine
    container_name: jobhunt_pro_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
